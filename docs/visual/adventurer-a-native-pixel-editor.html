<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>冒険者A 接地ポーズA — ネイティブドット作画</title>
<style>
body{font:15px system-ui;background:#eee7d9;color:#27231e;margin:0;padding:16px}main{max-width:850px;margin:auto}h1{font-size:1.4rem}
p{line-height:1.6}button,select{padding:8px;margin:3px}canvas{image-rendering:pixelated;touch-action:none;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 50%/16px 16px;max-width:100%;border:1px solid #777}
.layout{display:flex;gap:20px;flex-wrap:wrap}.controls{max-width:250px}img{max-width:200px;image-rendering:pixelated}#status{white-space:pre-wrap}
</style><main><h1>冒険者A — 接地ポーズA 作画</h1>
<p>128×192の透明な実ピクセルに直接描画。承認済みアンカーは参照のみで、却下済み候補や静止画を複製しません。ガイド線はPNGに入りません。</p>
<div class="layout"><div><canvas id="view" width="512" height="768" aria-label="ドット作画キャンバス"></canvas></div>
<div class="controls"><p>参照：<a href="../assets/adventurer-a-approved-anchor-v1.png" target="_blank" rel="noopener">承認済みアンカーを開く</a></p>
<label>道具 <select id="tool"><option value="pen">鉛筆</option><option value="erase">消しゴム</option><option value="fill">塗りつぶし</option></select></label>
<label>色 <input id="color" type="color" value="#27364b"></label>
<p><button id="undo">戻す</button><button id="clear">白紙に戻す</button></p>
<p><label><input type="checkbox" id="guide" checked>接地ガイドを表示</label></p>
<p><button id="save">透過PNGを書き出す</button></p><p id="status" role="status"></p>
<p>レビュー条件：左右の靴底を同じ地面へ、近い脚を前方へ。髪の銀色の前髪、紺のコート、袖、ベルト、ブーツをアンカーに合わせる。完成まではゲームへ反映しない。</p>
</div></div></main>
<script>
(()=>{'use strict';
const W=128,H=192,scale=4,canvas=document.querySelector('#view'),ctx=canvas.getContext('2d');
const data=document.createElement('canvas');data.width=W;data.height=H;const d=data.getContext('2d',{willReadFrequently:true});
const $=id=>document.getElementById(id);let drawing=false,history=[],last=null;
function snapshot(){if(history.length>=30)history.shift();history.push(d.getImageData(0,0,W,H));}
function render(){ctx.clearRect(0,0,512,768);ctx.imageSmoothingEnabled=false;ctx.drawImage(data,0,0,512,768);
if($('guide').checked){ctx.save();ctx.strokeStyle='#cf4838';ctx.setLineDash([8,6]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,704);ctx.lineTo(512,704);ctx.stroke();ctx.restore();}}
function coords(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)/r.width*W))),Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)/r.height*H)))];}
function pixel(x,y){if(x<0||y<0||x>=W||y>=H)return; if($('tool').value==='erase')d.clearRect(x,y,1,1);else{d.fillStyle=$('color').value;d.fillRect(x,y,1,1);}}
function line(a,b){let [x,y]=a,[tx,ty]=b,dx=Math.abs(tx-x),dy=Math.abs(ty-y),sx=x<tx?1:-1,sy=y<ty?1:-1,err=dx-dy;while(true){pixel(x,y);if(x===tx&&y===ty)break;let e=2*err;if(e>-dy){err-=dy;x+=sx;}if(e<dx){err+=dx;y+=sy;}}}
function fill(x,y){const img=d.getImageData(0,0,W,H),v=img.data,idx=(y*W+x)*4,old=Array.from(v.slice(idx,idx+4));const hex=$('color').value;const rgba=$('tool').value==='erase'?[0,0,0,0]:[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),255];if(old.every((z,i)=>z===rgba[i]))return;const stack=[y*W+x],seen=new Uint8Array(W*H);while(stack.length){const p=stack.pop();if(seen[p])continue;seen[p]=1;const j=p*4;if(!old.every((z,i)=>v[j+i]===z))continue;for(let i=0;i<4;i++)v[j+i]=rgba[i];const px=p%W,py=Math.floor(p/W);if(px>0)stack.push(p-1);if(px<W-1)stack.push(p+1);if(py>0)stack.push(p-W);if(py<H-1)stack.push(p+W);}d.putImageData(img,0,0);}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);snapshot();drawing=true;last=coords(e);if($('tool').value==='fill')fill(...last);else pixel(...last);render();});
canvas.addEventListener('pointermove',e=>{if(!drawing||$('tool').value==='fill')return;const p=coords(e);line(last,p);last=p;render();});
function stop(){drawing=false;last=null;}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
$('undo').onclick=()=>{const img=history.pop();if(img){d.putImageData(img,0,0);render();}};
$('clear').onclick=()=>{if(!confirm('作画を白紙に戻しますか？'))return;snapshot();d.clearRect(0,0,W,H);render();};
$('guide').onchange=render;
$('save').onclick=()=>{const img=d.getImageData(0,0,W,H),v=img.data,colors=new Set();let visible=0,partial=0;for(let i=0;i<v.length;i+=4){if(v[i+3]){visible++;colors.add(v[i]+','+v[i+1]+','+v[i+2]+','+v[i+3]);if(v[i+3]!==255)partial++;}}if(!visible||partial||colors.size>64){$('status').textContent='書き出し停止：'+(!visible?'白紙':partial?'半透明ピクセルあり':'64色を超過');return;}data.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='adventurer-a-contact-a-draft.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='書き出し：128×192 / '+colors.size+'色 / 未承認ドラフト';},'image/png');};
render();})();
</script></html>
