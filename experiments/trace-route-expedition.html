<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crownless — 痕跡の森・短い遠征実験</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101d23;color:#f4ebd8}*{box-sizing:border-box}
body{margin:0}main{max-width:520px;min-height:100dvh;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}
h1{font-size:1.1rem;margin:0}p{margin:0;line-height:1.4}#status{min-height:3em}#board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;aspect-ratio:1;width:100%;max-width:440px;margin:auto}
.tile{min-width:0;min-height:0;padding:0;border:1px solid #50616a;border-radius:5px;background:#28403c;color:#fff1ba;font-size:clamp(13px,5vw,24px)}
.tile:disabled{opacity:1;color:#b3bdbd}.tile.fog{background:#17252b;color:#66777a}.tile.wall{background:#384043}.tile.player{background:#997b3e;color:white}.tile:focus-visible{outline:3px solid white}
#actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}#actions button{min-height:48px;border-radius:9px;background:#41574d;border:1px solid #8d9c87;color:white;font:inherit;font-weight:600}#actions button:disabled{opacity:.4}small{color:#bac6c4}
</style>
<main><h1>痕跡の森 — 帰るまでが遠征</h1><p id="stats"></p><p id="status" role="status" aria-live="polite"></p><div id="board" aria-label="隣接する見えている道だけをタップして移動する7×7探索盤"></div><small>隣接する明るい道だけ移動可能。足跡を調べると隠し道が見つかる。蔓を持ち帰りロープを編むと次の遠征で崩れた橋を修復できる。橋の途中で足場を調べて固定するか、危険を承知で急いで渡ろう。敵の予兆を読んで防御/回避を使い分け、危険な奥地で希少素材を拾い、帰還地点まで生きて戻ろう。実ゲームのセーブ・倉庫・GPSには触れない。</small><div id="actions"><button id="search">足元を調べる</button><button id="fight">防御して反撃</button><button id="dodge">回避して側面攻撃</button><button id="retreat">撤退（素材を失う）</button><button id="restart">次の遠征</button><button id="craft">蔓でロープを編む</button></div></main>
<script>
'use strict';
// Self-contained opt-in prototype. Local storage uses an experiment-specific key.
const STORE='crownless-trace-route-spike-v1', SIZE=7, HOME='0,6', CLUE='2,4', SECRET='3,3', RELIC='5,1', FOE='4,2', FIBER='1,5', BRIDGE='4,4', CROSSING='5,4', CACHE='5,5';
const walls=new Set(['1,1','1,2','1,3','3,1','3,2','4,4','5,4','5,5','2,2','6,3']);
const key=(x,y)=>x+','+y, xy=s=>s.split(',').map(Number), near=(a,b)=>{const [x,y]=xy(a),[u,v]=xy(b);return Math.abs(x-u)+Math.abs(y-v)===1};
const el=id=>document.getElementById(id);
function fresh(){return {pos:HOME,hp:5,steps:0,found:false,opened:false,loot:0,warehouse:0,fiber:0,rope:false,bridge:false,braced:false,crossed:false,cacheTaken:false,guard:false,combat:false,enemyIntent:'',enemyHp:0,round:0,ended:false,seen:[HOME],message:'足跡を追って奥へ進もう。'};}
let s=fresh();try{const v=JSON.parse(localStorage.getItem(STORE));if(v&&typeof v.pos==='string'&&Array.isArray(v.seen)&&Number.isInteger(v.hp))s={...fresh(),...v};}catch{}
function save(){try{localStorage.setItem(STORE,JSON.stringify(s));}catch{s.message+='（この環境では保存不可）';}}
function visible(k){return s.seen.includes(k)||near(k,s.pos)||k===s.pos;}
function walkable(k){return (!walls.has(k)||(k===BRIDGE||k===CROSSING||k===CACHE)&&s.bridge)&&(k!==SECRET||s.opened);}
function end(success){s.ended=true;s.combat=false;if(success){s.warehouse+=s.loot;s.message='生還！ 素材'+s.loot+'個を倉庫へ持ち帰った。';}else{s.message='撤退。今回拾った素材'+s.loot+'個は失われた。';}if(!success)s.fiber=0;s.loot=0;save();render();}
function move(k){
 if(s.ended||s.combat||!near(s.pos,k)||!visible(k)||!walkable(k))return;
 s.pos=k;s.steps++;if(!s.seen.includes(k))s.seen.push(k);
 if(k===CROSSING&&!s.crossed){s.crossed=true;if(!s.braced){s.hp-=2;if(s.hp<=0){end(false);return;}s.message='足場が崩れ体力-2！ 橋の上で足場を固定すれば防げた。';}}
 if(k===FOE&&!s.guard){s.combat=true;s.enemyHp=3;s.round=0;s.enemyIntent='突進';s.message='獣が飛び出した！ 予兆は「突進」。防御か回避を選ぼう。';}
 else if(k===FIBER&&s.fiber===0&&!s.rope){s.fiber=1;s.message='丈夫な蔓を採集。生還してロープを編もう。';}
 else if(k===CROSSING){s.message=s.braced?'固定した足場を安全に渡った。':'足場が崩れた！ 体力を失ったが先へ進める。';}
 else if(k===CACHE&&!s.cacheTaken){s.cacheTaken=true;s.loot+=3;s.message='橋の先の隠し箱から古城の銀片を3個発見！ 生還まで失う危険がある。';}
 else if(k===RELIC&&s.loot===0){s.loot=2;s.message='希少な月光石を2個採集した。帰り道はまだ危険だ。';}
 else if(k===CLUE&&!s.found){s.message='地面に不自然な足跡。ここで「足元を調べる」を押そう。';}
 else if(k===HOME&&s.steps>0){end(true);return;}
 else{s.message='一歩進んだ。見えている隣接道のみ移動できる。';}
 save();render();
}
function render(){
 el('stats').textContent='体力 '+s.hp+'/5 · 歩数 '+s.steps+' · 手持ち '+s.loot+' · 持ち帰り累計 '+s.warehouse+' · 蔓 '+s.fiber+' · ロープ '+(s.rope?'有':'無');
 el('status').textContent=s.message+(s.combat?' 【敵HP '+s.enemyHp+'】':'');
 const board=el('board');board.replaceChildren();
 for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){
 const k=key(x,y),vis=visible(k),wall=walls.has(k),hidden=k===SECRET&&!s.opened,can=!s.ended&&!s.combat&&near(k,s.pos)&&vis&&(!wall||(k===BRIDGE||k===CROSSING||k===CACHE)&&s.bridge)&&!hidden;
 const b=document.createElement('button');b.className='tile'+(!vis||hidden?' fog':wall?' wall':'')+(k===s.pos?' player':'');
 b.disabled=!can;b.textContent=k===s.pos?'●':!vis||hidden?'?':wall?'▦':k===HOME?'⌂':k===CLUE?'⌕':k===RELIC?'◆':k===FIBER?'♣':k===BRIDGE?'═':k===CROSSING?'≈':k===CACHE?'✦':k===FOE?'!':'·';
 b.setAttribute('aria-label',k+' '+(can?'移動可能':vis?'移動不可':'未発見'));if(can)b.onclick=()=>move(k);board.append(b);
 }
 el('search').disabled=s.ended||s.combat||!(s.pos===CLUE&&!s.opened||s.pos==='4,3'&&s.rope&&!s.bridge||s.pos===BRIDGE&&s.bridge&&!s.braced);
 el('fight').disabled=!s.combat||s.ended;el('dodge').disabled=!s.combat||s.ended;
 el('retreat').disabled=s.ended;
 el('restart').disabled=!s.ended;el('craft').disabled=!s.ended||s.fiber<1||s.rope;
}
el('search').onclick=()=>{if(s.ended||s.combat)return;if(s.pos===CLUE&&!s.opened){s.found=true;s.opened=true;s.message='足跡の先に隠し道が現れた！';}else if(s.pos==='4,3'&&s.rope&&!s.bridge){s.bridge=true;s.message='ロープで崩れた橋を修復！ 橋上で足場を調べれば安全に渡れる。';}else if(s.pos===BRIDGE&&s.bridge&&!s.braced){s.braced=true;s.message='揺れる足場を固定した。対岸まで安全に進める。';}else return;save();render();};
function combatTurn(action){
 if(!s.combat||s.ended)return;
 const intent=s.enemyIntent;
 // Telegraph alternates: defend the charge, dodge the sweeping strike.
 const correct=(intent==='突進'&&action==='defend')||(intent==='薙ぎ払い'&&action==='dodge');
 const damage=correct?0:2;
 s.hp-=damage;s.enemyHp-=correct?2:1;s.round++;
 if(s.hp<=0){end(false);return;}
 if(s.enemyHp<=0){s.guard=true;s.combat=false;s.message='予兆を読んで獣を撃退！ '+(damage?'負傷したが':'無傷で')+'探索へ復帰した。';}
 else{s.enemyIntent=intent==='突進'?'薙ぎ払い':'突進';s.message=(correct?'見切り成功！':'読み違えた！ 体力-'+damage+'。')+' 次の予兆は「'+s.enemyIntent+'」。';}
 save();render();
}
el('fight').onclick=()=>combatTurn('defend');
el('dodge').onclick=()=>combatTurn('dodge');
el('retreat').onclick=()=>{if(!s.ended)end(false);};
el('restart').onclick=()=>{if(!s.ended)return;const {warehouse,rope,fiber}=s;s=fresh();s.warehouse=warehouse;s.rope=rope;s.fiber=fiber;save();render();};
el('craft').onclick=()=>{if(!s.ended||!s.fiber||s.rope)return;s.fiber=0;s.rope=true;s.message='ロープ完成。次の遠征で崩れた橋を修復できる。';save();render();};
render();
</script></html>
