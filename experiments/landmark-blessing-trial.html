<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crownless | 地標の祝福 実験</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b22;color:#f2ead9;font:16px/1.5 system-ui}main{max-width:480px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}h1{font-size:1.35rem;margin:0 0 8px}h2{font-size:1.05rem}section{background:#21313b;border:1px solid #52636b;border-radius:12px;padding:12px;margin:8px 0}#actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:14px}button{min-height:52px;border-radius:10px;border:1px solid #b6b2a0;background:#334d56;color:white;font:inherit;padding:8px}button:disabled{opacity:.4}button:focus-visible{outline:3px solid gold}small{color:#c9c5b7}#log{max-height:26dvh;overflow:auto}strong{color:#f6d78a}
</style>
<main><h1>地標の祝福・遠征実験</h1><small>位置情報を使わない独立実験。地標の守護者を倒して生還したときだけ祝福を獲得。</small>
<section id="status" aria-live="polite"></section><section><h2 id="heading"></h2><div id="description"></div></section><section id="log" aria-live="polite"></section><div id="actions"></div></main>
<script>
(() => {
const sites=[
{id:'spring',name:'癒しの泉',blessing:'遠征開始時HP +2',hp:2,guard:4},
{id:'watch',name:'見張り塔',blessing:'戦闘ダメージ +1',attack:1,guard:6},
{id:'mine',name:'古い鉱山',blessing:'生還時の素材 +2',loot:2,guard:5}
];
let s={phase:'map',owned:[],target:null,hp:8,loot:0,guard:0,turn:0,log:['地標を選び、守護者を倒して生還しよう。']};
const $=id=>document.getElementById(id);
const note=t=>{s.log.unshift(t);s.log=s.log.slice(0,8)};
function button(text,fn,disabled=false){const b=document.createElement('button');b.textContent=text;b.disabled=disabled;b.onclick=fn;$('actions').append(b)}
function render(){
$('actions').replaceChildren();
$('status').textContent='HP '+s.hp+'/10 | 未帰還素材 '+s.loot+' | 確保した地標 '+s.owned.length+'/3';
$('log').replaceChildren(...s.log.map(t=>{let p=document.createElement('div');p.textContent=t;return p}));
if(s.phase==='map'){
$('heading').textContent='地標を選ぶ';$('description').textContent='祝福は所有している地標ごとに1回だけ適用。発見だけでは獲得できない。';
for(const site of sites)button(site.name+(s.owned.includes(site.id)?'（確保済）':''),()=>{s.target=site.id;s.guard=site.guard;s.hp=Math.min(10,8+(s.owned.includes('spring')?2:0));s.loot=0;s.turn=0;s.phase='fight';note(site.name+'へ遠征。守護者が現れた！');render()},s.owned.includes(site.id));
}else if(s.phase==='fight'){
const site=sites.find(x=>x.id===s.target);
$('heading').textContent=site.name+'の守護者 HP '+s.guard;
$('description').textContent='攻撃は2ダメージ。見張り塔の祝福があれば+1。防御は次の攻撃を軽減する。';
button('攻撃',()=>fight(false));button('防御して反撃',()=>fight(true));button('撤退（素材喪失）',()=>{s.phase='map';s.loot=0;note('撤退した。');render()});
}else if(s.phase==='return'){
$('heading').textContent='守護者撃破！';$('description').textContent='素材を抱えて生還するか、追加採集で危険を冒すか。敗北すると未帰還素材を失う。';
button('安全に帰還',()=>{const site=sites.find(x=>x.id===s.target);s.owned.push(site.id);const reward=s.loot+(s.owned.includes('mine')?2:0);note(site.name+'を確保！素材'+reward+'を持ち帰った。祝福：'+site.blessing);s.phase='map';render()});
button('危険な追加採集',()=>{s.loot+=2;s.hp-=3;if(s.hp<=0){s.phase='map';s.loot=0;note('採集中に倒れた。素材も地標の権利も失った。')}else note('素材+2、HP-3。帰還を選べる。');render()});
}
}
function fight(defend){s.turn++;const dmg=2+(s.owned.includes('watch')?1:0);s.guard-=dmg;
if(s.guard<=0){s.loot=3;s.phase='return';note('守護者を倒した。素材3個を発見。まだ確保はしていない。')}
else{const incoming=defend?1:3;s.hp-=incoming;note((defend?'防御反撃':'攻撃')+'：'+dmg+'ダメージ、被害'+incoming);if(s.hp<=0){s.phase='map';s.loot=0;note('敗北。地標は未確保のまま。')}}
render()}
render();
})();
</script></html>
