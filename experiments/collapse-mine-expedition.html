<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crownless — 崩落坑道の遠征実験</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#111d23;color:#f4eddb}*{box-sizing:border-box}
body{margin:0}main{max-width:460px;height:100dvh;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
h1{font-size:1.1rem;margin:0}#map{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:min(100%,360px);aspect-ratio:1;margin:auto}
#map button{border:1px solid #71817b;border-radius:8px;background:#30483f;color:#fff;font-size:1.4rem;min-width:0}#map button:disabled{opacity:.4}#map button:focus-visible{outline:3px solid #fff}
#actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;max-height:32dvh;overflow:auto}
#actions button{min-height:48px;border-radius:9px;border:1px solid #82978a;background:#39554a;color:white;font:inherit}
#actions button[hidden]{display:none}#status{min-height:3em;line-height:1.4}small{color:#b9c9c4}
</style>
<main><h1>崩落坑道 — 持ち帰るか、奥へ進むか</h1><div id="stats"></div><div id="status" role="status" aria-live="polite"></div><div id="map" aria-label="隣接した歩行可能な道だけ選べる坑道"></div><small>入口から鉱脈を調べ、支柱を組んで崩落路を開ける。深部の鉱石は重く、帰路に落石が起きる。採掘量を欲張るか、帰路を補強するか選ぼう。実ゲームのセーブには触れない独立実験。</small><div id="actions"><button id="contractCache">結晶調査の依頼を受ける（生還報酬+6）</button><button id="contractRelic">古代鉱石の依頼を受ける（生還報酬+10）</button><button id="nestSearch">追跡獣の巣を調べる（討伐後に開放）</button><button id="nestLoot">巣の宝を回収（素材7・HP-1）</button><button id="nestRoute">巣穴を補強して近道にする（素材3）</button><button id="trap">追跡獣の罠を設置（素材2・次回遠征で発動）</button><button id="listen">足音を聞き分ける</button><button id="dodge">影をやり過ごす（HP-1）</button><button id="ambush">岩陰から奇襲（HP-2・素材5）</button><button id="survey">岩盤の亀裂を調べる</button><button id="shore">支柱を組む（素材2）</button><button id="mine">浅く採掘（素材3）</button><button id="deep">深く採掘（素材8・HP-2）</button><button id="followMine">浅掘りの先を追い掘り（追加素材6・HP-2・落石）</button><button id="brace">帰路を補強（素材2）</button><button id="escape">荷を捨てて落石を回避（素材3）</button><button id="lighten">荷を5個捨てて狭い帰路を抜ける</button><button id="pushThrough">荷を守って強行突破（HP-2）</button><button id="camp">岩陰で野営（素材2・HP+2／遠征1回）</button><button id="flood">水没した横穴を開く（素材2）</button><button id="valve">水門を開く（素材3）</button><button id="seal">水門を固定（素材2）</button><button id="relic">最深部の古代鉱石を回収（素材9・HP-1）</button><button id="salvage">水没横穴から遺物を回収（素材5・HP-1）</button><button id="trace">風の痕跡を追う（再遠征で解禁）</button><button id="echo">壁の反響を探る（HP-2・隠し鉱室発見）</button><button id="probe">壁を掘って隠し鉱室を探す（素材4）</button><button id="cache">希少結晶を採集（素材6・HP-1）</button><button id="cacheDeep">結晶脈を深掘り（素材10・HP-2）</button><button id="rope">結晶坑の縄梯子を架ける（素材3）</button><button id="vault">封印庫を開く（素材3）</button><button id="vaultCompass">古代羅針盤を入手（次回以降の調査+2）</button><button id="vaultCrystal">結晶を採掘（素材8・HP-2）</button><button id="supply">旧補給庫を漁る（素材4）</button><button id="restock">旧補給庫で応急手当（HP+2）</button><button id="spores">胞子の流れを読む（茸洞窟の危険を予測）</button><button id="harvestSafe">胞子を避けて慎重に採集（素材2）</button><button id="harvestRisk">胞子の奥へ踏み込む（素材7・HP-2）</button><button id="grove">燐光茸を採集（素材4・HP-1）</button><button id="rockSensor">落石探知器を製作（倉庫素材5・深掘りの帰路を1回守る）</button><button id="lantern">燐光ランタン製作（倉庫素材4）</button><button id="extract">緊急搬出（素材4を消費・生還）</button><button id="retreat">撤退（素材喪失）</button><button id="reinforce">坑道を恒久補強（倉庫素材6）</button><button id="again">次の遠征</button></div></main>
<script>
'use strict';
const KEY='crownless-collapse-expedition-v1';
const GROVE='3,3', VAULT='2,0';
const NEST='2,1';
const HOME='0,4', SURVEY='1,3', GATE='2,2', ORE='3,1', ROCK='2,3', TRACE='4,1', CACHE='4,0', FLOOD='4,2';
const path=new Set(['0,4','1,4','1,3','2,3','2,2','3,2','3,1','3,0','4,1','4,0','4,2','3,3','4,3','4,4','2,0','2,1']);
const xy=k=>k.split(',').map(Number);
const near=(a,b)=>{const [x,y]=xy(a),[u,v]=xy(b);return Math.abs(x-u)+Math.abs(y-v)===1};
const el=id=>document.getElementById(id);
const fresh=()=>({pos:HOME,hp:5,loot:0,warehouse:0,contract:null,contractDone:false,nestOpened:false,nestReward:false,nestShortcut:false,expeditions:0,reinforced:false,cacheFound:false,cacheLooted:false,rope:false,floodOpen:false,floodLooted:false,valveOpen:false,valveSealed:false,relicLooted:false,floodSurge:false,lantern:false,rockSensor:false,sensorCharge:false,extractUsed:false,groveLooted:false,sporesRead:false,supplyUsed:false,camped:false,carryStrain:false,carryResolved:false,stalker:'unseen',trapReady:false,trapTriggered:false,vaultOpen:false,vaultClaimed:false,ancientCompass:false,surveyed:false,shored:false,mined:false,followMined:false,deep:false,braced:false,rockfall:false,escaped:false,ended:false,seen:[HOME],message:'坑道へ踏み込もう。'});
let s=fresh();try{const stored=JSON.parse(localStorage.getItem(KEY));if(stored&&path.has(stored.pos)&&Array.isArray(stored.seen))s={...fresh(),...stored};}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{s.message+='（保存できません）'}}
function walkable(k){return path.has(k)&&(k!==GATE||s.shored||s.reinforced||s.nestShortcut)&&(k!==NEST||s.nestOpened)&&(k!==NEST||s.nestOpened)&&(k!==CACHE||s.cacheFound)&&(k!=='3,0'||s.rope)&&(k!==VAULT||s.vaultOpen)&&(k!==FLOOD||s.floodOpen)&&(k!==GROVE||s.lantern)&&(k!=='4,3'&&k!=='4,4'||s.valveOpen)}
function finish(win){s.ended=true;if(win){const reward=s.contract==='cache'&&s.cacheLooted?6:s.contract==='relic'&&s.relicLooted?10:0;s.warehouse+=s.loot+reward;s.contractDone=reward>0;s.expeditions++;s.message='生還！ 素材'+s.loot+'個を倉庫へ運んだ。'+(reward?'依頼達成報酬+'+reward+'個。':'')+'次の遠征で支柱の跡を再発見できる。'}else{s.message='撤退。手持ち素材'+s.loot+'個を失った。'}s.loot=0;save();render()}
function move(k){
 if(s.ended||s.carryStrain||!near(s.pos,k)||!walkable(k))return;
 s.pos=k;if(!s.seen.includes(k))s.seen.push(k);
 if(k==='3,2'&&s.stalker==='unseen'&&s.trapReady){s.trapReady=false;s.trapTriggered=true;s.stalker='defeated';s.loot+=4;s.message='前回設置した罠が作動！ 追跡獣を退け、素材4個を確保。再訪の準備が報われた。';save();render();return}
 if(k==='3,2'&&s.stalker==='unseen'){s.stalker='warning';s.message='暗がりから足音。立ち止まって予兆を聞くか、先へ進むか。';save();render();return}
 if(s.stalker==='warning'&&k!=='3,2'){s.hp-=2;s.stalker='struck';s.message='追跡獣が背後から襲った！ HP-2。足音を調べれば奇襲を避けられた。';if(s.hp<=0){finish(false);return}save();render();return}
 if(k===ROCK&&s.loot>=12&&!s.carryResolved&&s.hp>2){s.carryStrain=true;s.message='重い戦利品が狭い帰路に引っかかった！ 素材5個を捨てるか、HP2を使って強行突破するか。決めるまで移動できない。';save();render();return}
 if(k===FLOOD&&s.floodSurge&&!s.valveSealed){s.hp-=2;s.floodSurge=false;s.message='開いた水門から濁流が噴き出した！ HP-2。';if(s.hp<=0){finish(false);return}save();render();return}
 if(k===ROCK&&s.rockfall&&!s.braced&&!s.escaped){
   if(s.sensorCharge){s.sensorCharge=false;s.rockfall=false;s.message='探知器が落石を予告！ 安全な岩陰へ退避してHPを守った。次の遠征で再充電される。';save();render();return}
   s.hp-=2;s.message='落石が帰路を直撃！ HP-2。';s.rockfall=false;
   if(s.hp<=0){finish(false);return}
 }else if(k==='3,2'&&s.stalker==='warning')s.message='獣の足音が近い。聞き分けて対処しよう。';
 else if(k===NEST)s.message='追跡獣の巣。巣の宝を奪うか、素材を使って帰路の近道を作るか。';
 else if(k===ORE)s.message='鉱脈に到達。浅く掘るか、危険な深部へ進むか。';
 else if(k===TRACE&&s.expeditions>0&&!s.cacheFound)s.message='以前の遠征では見落とした風の流れ。壁の向こうに空洞がありそうだ。';
 else if(k==='3,0')s.message='縄梯子の先に古い補給庫。残った物資を回収するか、薬草で体力を戻すか。どちらか一度だけ。';
 else if(k===GROVE)s.message='胞子が周期的に舞う茸洞窟。流れを読んで慎重に採るか、奥の大株を狙うか。';
 else if(k==='4,4')s.message='最深部の古代鉱石。回収すれば水門の水圧が上がる。';
 else if(k==='4,3')s.message='水門の先に乾いた旧坑道が続いている。';
 else if(k===FLOOD)s.message='水没横穴。足場は脆いが沈んだ遺物が見える。';
 else if(k===CACHE)s.message='隠し鉱室を発見。希少な結晶を持ち帰れる。';
 else if(k===SURVEY&&!s.surveyed)s.message='壁に亀裂がある。調査すれば崩落路の支柱を組める。';
 else s.message='坑道を一歩進んだ。';
 if(k===VAULT)s.message='封印庫の石盤。永久に役立つ古代羅針盤か、今すぐ持ち帰る結晶を選ぼう。';
 if(k===HOME&&s.seen.length>1){finish(true);return}
 save();render();
}
function render(){
 el('stats').textContent='HP '+s.hp+'/5 ・ 手持ち '+s.loot+' ・ 倉庫 '+s.warehouse;
 el('status').textContent=s.message;
 const board=el('map');board.replaceChildren();
 for(let y=0;y<5;y++)for(let x=0;x<5;x++){
  const k=x+','+y,visible=(k!==CACHE||s.cacheFound)&&(k!=='3,0'||s.rope)&&(k!==VAULT||s.vaultOpen)&&(k!==FLOOD||s.floodOpen)&&(k!==GROVE||s.lantern)&&(k!=='4,3'&&k!=='4,4'||s.valveOpen)&&(s.seen.includes(k)||near(s.pos,k)),can=!s.ended&&!s.carryStrain&&visible&&near(s.pos,k)&&walkable(k);
  const b=document.createElement('button');b.disabled=!can;b.textContent=k===s.pos?'●':!visible?'?':!path.has(k)?'▦':k===GATE&&!s.shored&&!s.reinforced&&!s.nestShortcut?'▦':k===VAULT?'◈':k===CACHE?'✦':k===FLOOD?'≈':k===GROVE?'♣':k===ORE?'◆':k===HOME?'⌂':'·';b.setAttribute('aria-label',k);b.onclick=()=>move(k);board.append(b);
 }
 const allowed={lighten:!s.ended&&s.pos===ROCK&&s.carryStrain&&s.loot>=5,pushThrough:!s.ended&&s.pos===ROCK&&s.carryStrain&&s.hp>2,nestSearch:!s.ended&&s.pos===GATE&&s.stalker==='defeated'&&!s.nestOpened,nestLoot:!s.ended&&s.pos===NEST&&!s.nestReward&&s.hp>1,nestRoute:!s.ended&&s.pos===NEST&&!s.nestReward&&s.loot>=3,contractCache:!s.ended&&s.pos===HOME&&s.seen.length===1&&!s.contract,contractRelic:!s.ended&&s.pos===HOME&&s.seen.length===1&&!s.contract,trap:!s.ended&&s.pos===TRACE&&!s.trapReady&&!s.trapTriggered&&s.loot>=2,listen:!s.ended&&s.pos==='3,2'&&s.stalker==='warning',dodge:!s.ended&&s.pos==='3,2'&&s.stalker==='ready'&&s.hp>1,ambush:!s.ended&&s.pos==='3,2'&&s.stalker==='ready'&&s.hp>2,survey:!s.ended&&s.pos===SURVEY&&!s.surveyed,shore:!s.ended&&s.pos===SURVEY&&s.surveyed&&!s.shored&&!s.reinforced&&s.loot>=2,mine:!s.ended&&s.pos===ORE&&!s.mined,deep:!s.ended&&s.pos===ORE&&!s.mined&&s.hp>2,followMine:!s.ended&&s.pos===ORE&&s.mined&&!s.deep&&!s.followMined&&s.hp>2,brace:!s.ended&&s.pos===ORE&&s.rockfall&&!s.braced&&s.loot>=2,escape:!s.ended&&s.pos===ORE&&s.rockfall&&!s.escaped&&s.loot>=3,camp:!s.ended&&s.pos===ROCK&&!s.camped&&s.loot>=2&&s.hp<5,flood:!s.ended&&s.pos===TRACE&&!s.floodOpen&&s.loot>=2,valve:!s.ended&&s.pos===FLOOD&&!s.valveOpen&&s.loot>=3,seal:!s.ended&&s.pos==='4,3'&&s.floodSurge&&!s.valveSealed&&s.loot>=2,relic:!s.ended&&s.pos==='4,4'&&!s.relicLooted&&s.hp>1,salvage:!s.ended&&s.pos===FLOOD&&!s.floodLooted&&s.hp>1,trace:!s.ended&&s.pos===TRACE&&s.expeditions>0&&!s.cacheFound,echo:!s.ended&&s.pos===TRACE&&!s.cacheFound&&s.hp>2,probe:!s.ended&&s.pos===TRACE&&s.expeditions===0&&!s.cacheFound&&s.loot>=4,cache:!s.ended&&s.pos===CACHE&&!s.cacheLooted&&s.hp>1,cacheDeep:!s.ended&&s.pos===CACHE&&!s.cacheLooted&&s.hp>2,rope:!s.ended&&s.pos===CACHE&&!s.rope&&s.loot>=3,vault:!s.ended&&s.pos==='3,0'&&!s.vaultOpen&&s.loot>=3,vaultCompass:!s.ended&&s.pos===VAULT&&!s.vaultClaimed,vaultCrystal:!s.ended&&s.pos===VAULT&&!s.vaultClaimed&&s.hp>2,supply:!s.ended&&s.pos==='3,0'&&!s.supplyUsed,restock:!s.ended&&s.pos==='3,0'&&!s.supplyUsed&&s.hp<5,grove:false,spores:!s.ended&&s.pos===GROVE&&!s.groveLooted&&!s.sporesRead,harvestSafe:!s.ended&&s.pos===GROVE&&!s.groveLooted&&s.sporesRead,harvestRisk:!s.ended&&s.pos===GROVE&&!s.groveLooted&&s.sporesRead&&s.hp>2,rockSensor:s.ended&&s.warehouse>=5&&!s.rockSensor,lantern:s.ended&&s.warehouse>=4&&!s.lantern,extract:!s.ended&&s.pos===ORE&&s.loot>=4&&!s.extractUsed,retreat:!s.ended,reinforce:s.ended&&s.warehouse>=6&&!s.reinforced,again:s.ended};
 for(const [id,yes] of Object.entries(allowed))el(id).hidden=!yes;
}
function act(id,condition,change){el(id).onclick=()=>{if(!condition())return;change();save();render()}}
act('lighten',()=>!s.ended&&s.pos===ROCK&&s.carryStrain&&s.loot>=5,()=>{s.loot-=5;s.carryStrain=false;s.carryResolved=true;s.message='素材5個を置き、荷を軽くして帰路を確保した。残りを生還させよう。';});
act('pushThrough',()=>!s.ended&&s.pos===ROCK&&s.carryStrain&&s.hp>2,()=>{s.hp-=2;s.carryStrain=false;s.carryResolved=true;s.message='HP2を消耗して重い荷を運び抜いた。素材はすべて守った。';});
act('nestSearch',()=>!s.ended&&s.pos===GATE&&s.stalker==='defeated'&&!s.nestOpened,()=>{s.nestOpened=true;s.message='追跡獣の足跡をたどり、北に巣穴を発見した。';});
act('nestLoot',()=>!s.ended&&s.pos===NEST&&!s.nestReward&&s.hp>1,()=>{s.nestReward=true;s.hp--;s.loot+=7;s.message='巣から希少素材7個を奪った。HP-1。帰路の近道は作れない。';});
act('nestRoute',()=>!s.ended&&s.pos===NEST&&!s.nestReward&&s.loot>=3,()=>{s.nestReward=true;s.loot-=3;s.nestShortcut=true;s.message='素材3個で巣穴を補強。次の遠征から崩落路の支柱なしで通れる。';});
act('contractCache',()=>!s.ended&&s.pos===HOME&&s.seen.length===1&&!s.contract,()=>{s.contract='cache';s.message='結晶調査を受注。隠し鉱室で採掘して生還すると倉庫に追加素材6個。撤退では報酬なし。';});
act('contractRelic',()=>!s.ended&&s.pos===HOME&&s.seen.length===1&&!s.contract,()=>{s.contract='relic';s.message='古代鉱石調査を受注。最深部の鉱石を回収して生還すると倉庫に追加素材10個。撤退では報酬なし。';});
act('trap',()=>!s.ended&&s.pos===TRACE&&!s.trapReady&&!s.trapTriggered&&s.loot>=2,()=>{s.loot-=2;s.trapReady=true;s.message='素材2個で追跡獣の通り道に罠を設置。次の遠征で発動し、素材4個を回収できる。';});
act('listen',()=>!s.ended&&s.pos==='3,2'&&s.stalker==='warning',()=>{s.stalker='ready';s.message='追跡獣が右の岩陰から飛び出す予兆！ 身をかわすか、先手を打って素材を奪うか。'});
act('dodge',()=>!s.ended&&s.pos==='3,2'&&s.stalker==='ready'&&s.hp>1,()=>{s.hp--;s.stalker='avoided';s.message='岩陰へ滑り込み、獣をやり過ごした。HP-1。';});
act('ambush',()=>!s.ended&&s.pos==='3,2'&&s.stalker==='ready'&&s.hp>2,()=>{s.hp-=2;s.loot+=5;s.stalker='defeated';s.message='岩を落として追跡獣を撃退！ HP-2、素材5個。生還して持ち帰ろう。';});
act('survey',()=>s.pos===SURVEY&&!s.surveyed&&!s.ended,()=>{s.surveyed=true;s.loot+=s.ancientCompass?4:2;s.message='亀裂の奥で木材'+(s.ancientCompass?4:2)+'個を発見。支柱を組めば先へ進める。'});
act('shore',()=>s.pos===SURVEY&&s.surveyed&&!s.shored&&!s.reinforced&&s.loot>=2&&!s.ended,()=>{s.loot-=2;s.shored=true;s.message='支柱を固定。奥の崩落路が開いた。'});
act('mine',()=>s.pos===ORE&&!s.mined&&!s.ended,()=>{s.mined=true;s.loot+=3;s.message='浅い鉱脈から素材3個。帰ろう。'});
act('deep',()=>s.pos===ORE&&!s.mined&&s.hp>2&&!s.ended,()=>{s.mined=true;s.deep=true;s.hp-=2;s.loot+=8;s.rockfall=true;s.message='深部から素材8個！ 落石が始まった。素材を使って帰路を補強するか、荷を捨てて回避するか、危険なまま戻るか。'});
act('followMine',()=>!s.ended&&s.pos===ORE&&s.mined&&!s.deep&&!s.followMined&&s.hp>2,()=>{s.followMined=true;s.deep=true;s.hp-=2;s.loot+=6;s.rockfall=true;s.message='浅掘りの奥に新たな鉱脈！ 追加素材6個を確保したがHP-2、帰路に落石が発生。今から補強するか危険を承知で帰るか選ぼう。';});
act('brace',()=>s.pos===ORE&&s.rockfall&&!s.braced&&s.loot>=2&&!s.ended,()=>{s.loot-=2;s.braced=true;s.message='素材2個で帰路を補強。落石の被害を避けられる。'});
act('escape',()=>s.pos===ORE&&s.rockfall&&!s.escaped&&s.loot>=3&&!s.ended,()=>{s.loot-=3;s.escaped=true;s.message='荷物3個を置いて落石をやり過ごした。帰還しよう。'});
act('camp',()=>!s.ended&&s.pos===ROCK&&!s.camped&&s.loot>=2&&s.hp<5,()=>{s.loot-=2;s.hp=Math.min(5,s.hp+2);s.camped=true;s.message='岩陰に小さな野営地を作った。素材2個を消費してHPを2回復。今回の遠征ではもう休めない。';});
act('flood',()=>s.pos===TRACE&&!s.floodOpen&&s.loot>=2&&!s.ended,()=>{s.loot-=2;s.floodOpen=true;s.message='素材2個で水路に足場を渡した。南の水没横穴が開いた。';});
act('valve',()=>!s.ended&&s.pos===FLOOD&&!s.valveOpen&&s.loot>=3,()=>{s.loot-=3;s.valveOpen=true;s.message='素材3個で錆びた水門を開いた。南の旧坑道が通れるようになった。';});
act('seal',()=>!s.ended&&s.pos==='4,3'&&s.floodSurge&&!s.valveSealed&&s.loot>=2,()=>{s.loot-=2;s.valveSealed=true;s.message='素材2個で水門を固定。濁流を防いだ。';});
act('relic',()=>!s.ended&&s.pos==='4,4'&&!s.relicLooted&&s.hp>1,()=>{s.hp--;s.loot+=9;s.relicLooted=true;s.floodSurge=true;s.message='古代鉱石9個を回収！ HP-1。水圧が増した。帰路の水門を補強するか、濁流を受けるか。';});
act('salvage',()=>s.pos===FLOOD&&!s.floodLooted&&s.hp>1&&!s.ended,()=>{s.floodLooted=true;s.hp--;s.loot+=5;s.message='水底から遺物素材5個を引き上げた。冷水でHP-1。生還して初めて倉庫に入る。';});
act('trace',()=>s.pos===TRACE&&s.expeditions>0&&!s.cacheFound&&!s.ended,()=>{s.cacheFound=true;s.message='壁の隙間から隠し鉱室への通路を見つけた。北の一歩が開いた。'});
act('echo',()=>!s.ended&&s.pos===TRACE&&!s.cacheFound&&s.hp>2,()=>{s.hp-=2;s.cacheFound=true;s.message='壁に耳を当て、崩れかけた岩を手探りで抜いた。HP-2。北の隠し鉱室が開いた。素材を使わず危険を選んだ。';});
act('probe',()=>!s.ended&&s.pos===TRACE&&s.expeditions===0&&!s.cacheFound&&s.loot>=4,()=>{s.loot-=4;s.cacheFound=true;s.message='素材4個を使って風の通り道を掘り当てた！ 初回遠征でも北の隠し鉱室へ進める。素材を残して帰るか、結晶を狙うか。'});
act('cacheDeep',()=>!s.ended&&s.pos===CACHE&&!s.cacheLooted&&s.hp>2,()=>{s.cacheLooted=true;s.hp-=2;s.loot+=10;s.message='結晶脈の奥まで掘り進めた！ HP-2、希少結晶10個。帰路に耐えられるか判断しよう。';});
act('cache',()=>s.pos===CACHE&&!s.cacheLooted&&!s.ended&&s.hp>1,()=>{s.cacheLooted=true;s.hp--;s.loot+=6;s.message='希少結晶6個を確保。HP-1。生還すれば倉庫に持ち帰れる。'});
act('rope',()=>!s.ended&&s.pos===CACHE&&!s.rope&&s.loot>=3,()=>{s.loot-=3;s.rope=true;s.message='素材3個で結晶坑に縄梯子を架けた。西の新しい道から鉱脈へ抜けられる。次の遠征でも使える。';});
act('vault',()=>!s.ended&&s.pos==='3,0'&&!s.vaultOpen&&s.loot>=3,()=>{s.loot-=3;s.vaultOpen=true;s.message='素材3個で封印庫の石扉を開けた。西の隠し部屋へ進める。';});
act('vaultCompass',()=>!s.ended&&s.pos===VAULT&&!s.vaultClaimed,()=>{s.vaultClaimed=true;s.ancientCompass=true;s.message='古代羅針盤を確保！ 次回以降の遠征で亀裂調査から追加素材2個を発見できる。';});
act('vaultCrystal',()=>!s.ended&&s.pos===VAULT&&!s.vaultClaimed&&s.hp>2,()=>{s.vaultClaimed=true;s.hp-=2;s.loot+=8;s.message='危険な結晶採掘に成功。HP-2、素材8個。羅針盤は手に入らない。';});
act('supply',()=>!s.ended&&s.pos==='3,0'&&!s.supplyUsed,()=>{s.supplyUsed=true;s.loot+=4;s.message='旧補給庫から素材4個を確保。手当用の薬草は残さなかった。生還すれば倉庫に入る。';});
act('restock',()=>!s.ended&&s.pos==='3,0'&&!s.supplyUsed&&s.hp<5,()=>{s.supplyUsed=true;s.hp=Math.min(5,s.hp+2);s.message='旧補給庫の薬草でHPを2回復。資材は回収できなくなった。';});
act('spores',()=>!s.ended&&s.pos===GROVE&&!s.groveLooted&&!s.sporesRead,()=>{s.sporesRead=true;s.message='胞子は一定の間隔で渦を作る。縁なら無傷で素材2個、中心の大株ならHP-2で素材7個。どちらか一度だけ。';});
act('harvestSafe',()=>!s.ended&&s.pos===GROVE&&!s.groveLooted&&s.sporesRead,()=>{s.groveLooted=true;s.loot+=2;s.message='胞子の切れ目を見極め、無傷で素材2個を採集。奥の大株は残した。';});
act('harvestRisk',()=>!s.ended&&s.pos===GROVE&&!s.groveLooted&&s.sporesRead&&s.hp>2,()=>{s.groveLooted=true;s.hp-=2;s.loot+=7;s.message='胞子の渦を突っ切り大株を採集！ HP-2、素材7個。帰還できるか判断しよう。';});
act('rockSensor',()=>s.ended&&s.warehouse>=5&&!s.rockSensor,()=>{s.warehouse-=5;s.rockSensor=true;s.message='落石探知器を製作。次回から各遠征1回、深掘り後の帰路の落石を無傷で回避できる。';});
act('lantern',()=>s.ended&&s.warehouse>=4&&!s.lantern,()=>{s.warehouse-=4;s.lantern=true;s.message='燐光ランタンを製作。次回から岩陰の茸洞窟へ進める。';});
act('reinforce',()=>s.ended&&s.warehouse>=6&&!s.reinforced,()=>{s.warehouse-=6;s.reinforced=true;s.message='倉庫の素材6個で坑道の支柱を恒久補強。次回から調査・支柱作りなしで奥へ進める。'});
el('extract').onclick=()=>{if(s.ended||s.pos!==ORE||s.loot<4||s.extractUsed)return;s.loot-=4;s.extractUsed=true;s.pos=HOME;finish(true);};
el('retreat').onclick=()=>{if(!s.ended)finish(false)};
el('again').onclick=()=>{if(!s.ended)return;const {warehouse,expeditions,reinforced,nestOpened,nestReward,nestShortcut,lantern,rope,cacheFound,floodOpen,valveOpen,trapReady,vaultOpen,vaultClaimed,ancientCompass,rockSensor}=s;s=fresh();s.warehouse=warehouse;s.expeditions=expeditions;s.reinforced=reinforced;s.nestOpened=nestOpened;s.nestReward=nestReward;s.nestShortcut=nestShortcut;s.lantern=lantern;s.rope=rope;s.cacheFound=cacheFound;s.floodOpen=floodOpen;s.valveOpen=valveOpen;s.trapReady=trapReady;s.vaultOpen=vaultOpen;s.vaultClaimed=vaultClaimed;s.ancientCompass=ancientCompass;s.rockSensor=rockSensor;s.sensorCharge=rockSensor;save();render()};
render();
</script></html>
