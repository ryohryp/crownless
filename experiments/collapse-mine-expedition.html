<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crownless — 崩落坑道の遠征実験</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#111d23;color:#f4eddb}*{box-sizing:border-box}
body{margin:0}main{max-width:460px;height:100dvh;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
h1{font-size:1.1rem;margin:0}#map{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:min(100%,360px);aspect-ratio:1;margin:auto}
#map button{border:1px solid #71817b;border-radius:8px;background:#30483f;color:#fff;font-size:1.4rem;min-width:0}#map button:disabled{opacity:.4}#map button:focus-visible{outline:3px solid #fff}
#actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;max-height:32dvh;overflow:auto}
#actions button{min-height:48px;border-radius:9px;border:1px solid #82978a;background:#39554a;color:white;font:inherit}
#actions button[hidden]{display:none}#status{min-height:3em;line-height:1.4}small{color:#b9c9c4}
</style>
<main><h1>崩落坑道 — 持ち帰るか、奥へ進むか</h1><div id="stats"></div><div id="status" role="status" aria-live="polite"></div><div id="map" aria-label="隣接した歩行可能な道だけ選べる坑道"></div><small>入口から鉱脈を調べ、支柱を組んで崩落路を開ける。深部の鉱石は重く、帰路に落石が起きる。採掘量を欲張るか、帰路を補強するか選ぼう。実ゲームのセーブには触れない独立実験。</small><div id="actions"><button id="oreMark">鉱脈のひび割れを記録（帰路の危険を予測）</button><button id="oreVent">ひび割れを利用して排気路を開く（素材3・次回以降の落石軽減）</button><button id="oreVentEscape">排気路から落石を回避（素材1）</button><button id="clueSurvey">崩落壁の古い測量印を写す</button><button id="clueRock">岩陰の方位刻印を調べる</button><button id="clueTrace">風穴の地図片を拾う</button><button id="clueDig">三つの手掛かりから埋蔵箱を掘る（素材6）</button><button id="clueBeacon">埋蔵箱を測量標に改造（素材4・次回以降の調査+2）</button><button id="minerListen">崩落壁の救難信号を調べる</button><button id="minerRescue">負傷した坑夫を救助（HP-2・素材2）</button><button id="minerSupply">救助した坑夫の補給を受け取る（HP+1または素材2）</button><button id="cartScavenge">廃鉱車から資材を拾う（素材3・今回限り）</button><button id="cartRepair">廃鉱車を修理（手持ち素材4・再遠征で補給）</button><button id="crossGap">崩れた谷を渡る（HP-1・対岸の素材4）</button><button id="bridgeGap">対岸に恒久橋を架ける（素材3）</button><button id="packFlare">帰還信号弾を準備（倉庫素材4）</button><button id="flareReturn">信号弾で緊急帰還（手持ち素材3を消費）</button><button id="packProbe">探査具を準備（倉庫素材3・隠し鉱室を安全に発見）</button><button id="useProbe">探査具で風の抜け道を探る（HP消費なし）</button><button id="contractCache">結晶調査の依頼を受ける（生還報酬+6）</button><button id="contractRelic">古代鉱石の依頼を受ける（生還報酬+10）</button><button id="nestSearch">追跡獣の巣を調べる（討伐後に開放）</button><button id="nestLoot">巣の宝を回収（素材7・HP-1）</button><button id="nestRoute">巣穴を補強して近道にする（素材3）</button><button id="trap">追跡獣の罠を設置（素材2・次回遠征で発動）</button><button id="listen">足音を聞き分ける</button><button id="dodge">影をやり過ごす（HP-1）</button><button id="ambush">岩陰から奇襲（HP-2・素材5）</button><button id="highGround">岩棚へ回り込む（素材2・高所を確保）</button><button id="highStrike">高所から落石攻撃（HP-1・素材7）</button><button id="highEscape">高所から安全に離脱（無傷）</button><button id="blockPass">落石で獣道を封鎖（素材4・次回以降は安全）</button><button id="decoy">素材で囮を作り追跡獣を誘導（素材3消費・HP無傷・素材4回収）</button><button id="survey">岩盤の亀裂を調べる</button><button id="shore">支柱を組む（素材2）</button><button id="oreListen">鉱脈の鳴動を調べる（安全な鉱脈を見分ける）</button><button id="oreSafe">安定した鉱脈を選んで採掘（素材5・落石なし）</button><button id="mine">浅く採掘（素材3）</button><button id="deep">深く採掘（素材8・HP-2）</button><button id="followMine">浅掘りの先を追い掘り（追加素材6・HP-2・落石）</button><button id="winch">鉱脈に恒久巻上機を設置（素材4）</button><button id="winchMine">巻上機で深部を安全採掘（素材6・HP消費なし）</button><button id="brace">帰路を補強（素材2）</button><button id="escape">荷を捨てて落石を回避（素材3）</button><button id="lighten">荷を5個捨てて狭い帰路を抜ける</button><button id="pushThrough">荷を守って強行突破（HP-2）</button><button id="ledge">荷を3個使い安全な荷運び道を恒久整備</button><button id="resonanceListen">石柱の音階を調べる</button><button id="resonanceLow">低い石柱を叩く</button><button id="resonanceHigh">高い石柱を叩く</button><button id="resonanceCollect">共鳴で現れた鉱石を回収（素材7）</button><button id="echoMark">岩壁の響きを記録（次回遠征の隠し鉱脈）</button><button id="echoCollect">再訪した響きの鉱脈を採掘（素材5・HP-1）</button><button id="anchor">帰還用の滑車を設置（素材4・今回限り）</button><button id="anchorReturn">滑車で戦利品を運び帰還（素材2消費）</button><button id="stash">岩陰に素材5個を隠す（次回遠征で回収）</button><button id="retrieveStash">隠した素材を回収（帰還リスクあり）</button><button id="camp">岩陰で野営（素材2・HP+2／遠征1回）</button><button id="flood">水没した横穴を開く（素材2）</button><button id="valve">水門を開く（素材3）</button><button id="pressureRead">水圧の脈動を読む（隠し水晶洞を探す）</button><button id="pressureTap">水圧を利用して水晶洞を開く（素材2・HP-1）</button><button id="pressureCollect">水晶洞の鉱石を採集（素材8・HP-1）</button><button id="seal">水門を固定（素材2）</button><button id="relic">最深部の古代鉱石を回収（素材9・HP-1）</button><button id="salvage">水没横穴から遺物を回収（素材5・HP-1）</button><button id="trace">風の痕跡を追う（再遠征で解禁）</button><button id="echo">壁の反響を探る（HP-2・隠し鉱室発見）</button><button id="probe">壁を掘って隠し鉱室を探す（素材4）</button><button id="cache">希少結晶を採集（素材6・HP-1）</button><button id="fragileCrystal">脆い星晶を採掘（素材12・帰路で保護が必要）</button><button id="wrapCrystal">星晶を梱包（素材3・帰路の破損を防ぐ）</button><button id="cacheDeep">結晶脈を深掘り（素材10・HP-2）</button><button id="rope">結晶坑の縄梯子を架ける（素材3）</button><button id="vault">封印庫を開く（素材3）</button><button id="vaultCompass">古代羅針盤を入手（次回以降の調査+2）</button><button id="vaultCrystal">結晶を採掘（素材8・HP-2）</button><button id="supply">旧補給庫を漁る（素材4）</button><button id="restock">旧補給庫で応急手当（HP+2）</button><button id="spores">胞子の流れを読む（茸洞窟の危険を予測）</button><button id="harvestSafe">胞子を避けて慎重に採集（素材2）</button><button id="harvestRisk">胞子の奥へ踏み込む（素材7・HP-2）</button><button id="grove">燐光茸を採集（素材4・HP-1）</button><button id="rockSensor">落石探知器を製作（倉庫素材5・深掘りの帰路を1回守る）</button><button id="lantern">燐光ランタン製作（倉庫素材4）</button><button id="extract">緊急搬出（素材4を消費・生還）</button><button id="evacuate">負傷撤収（手持ち素材の半分を放棄・HP1以下）</button><button id="retreat">撤退（素材喪失）</button><button id="reinforce">坑道を恒久補強（倉庫素材6）</button><button id="again">次の遠征</button></div></main>
<script>
'use strict';
const KEY='crownless-collapse-expedition-v1';
const GROVE='3,3', VAULT='2,0';
const NEST='2,1';
const HOME='0,4', SURVEY='1,3', GATE='2,2', ORE='3,1', ROCK='2,3', TRACE='4,1', CACHE='4,0', FLOOD='4,2';
const path=new Set(['0,4','1,4','1,3','2,3','2,2','3,2','3,1','3,0','4,1','4,0','4,2','3,3','4,3','4,4','2,0','2,1','2,4']);
const xy=k=>k.split(',').map(Number);
const near=(a,b)=>{const [x,y]=xy(a),[u,v]=xy(b);return Math.abs(x-u)+Math.abs(y-v)===1};
const el=id=>document.getElementById(id);
const fresh=()=>({pos:HOME,hp:5,loot:0,clueSurvey:false,clueRock:false,clueTrace:false,clueReward:false,clueBeacon:false,clueBonusUsed:false,warehouse:0,probePacked:false,flarePacked:false,gapCrossed:false,gapBridge:false,gapLooted:false,cartRepaired:false,cartUsed:false,minerHeard:false,minerRescued:false,minerSupplied:false,contract:null,contractDone:false,nestOpened:false,nestReward:false,nestShortcut:false,passBlocked:false,expeditions:0,reinforced:false,cacheFound:false,cacheLooted:false,fragileCrystal:false,crystalWrapped:false,rope:false,floodOpen:false,floodLooted:false,valveOpen:false,valveSealed:false,pressureRead:false,pressureOpened:false,pressureCollected:false,relicLooted:false,floodSurge:false,lantern:false,rockSensor:false,sensorCharge:false,extractUsed:false,groveLooted:false,sporesRead:false,supplyUsed:false,camped:false,resonanceStage:0,resonanceSolved:false,resonanceCollected:false,echoMarked:false,echoReady:false,echoCollected:false,carryStrain:false,carryResolved:false,safeLedge:false,hiddenStash:0,anchorReady:false,stalker:'unseen',highGroundReady:false,trapReady:false,trapTriggered:false,vaultOpen:false,vaultClaimed:false,ancientCompass:false,surveyed:false,shored:false,winchBuilt:false,oreListened:false,oreMarked:false,oreVentBuilt:false,mined:false,followMined:false,deep:false,braced:false,rockfall:false,escaped:false,ended:false,seen:[HOME],message:'坑道へ踏み込もう。'});
let s=fresh();try{const stored=JSON.parse(localStorage.getItem(KEY));if(stored&&path.has(stored.pos)&&Array.isArray(stored.seen))s={...fresh(),...stored};}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{s.message+='（保存できません）'}}
function walkable(k){return path.has(k)&&(k!=='2,4'||s.gapCrossed||s.gapBridge)&&(k!==GATE||s.shored||s.reinforced||s.nestShortcut)&&(k!==NEST||s.nestOpened)&&(k!==CACHE||s.cacheFound)&&(k!=='3,0'||s.rope)&&(k!==VAULT||s.vaultOpen)&&(k!==FLOOD||s.floodOpen)&&(k!==GROVE||s.lantern)&&(k!=='4,3'&&k!=='4,4'||s.valveOpen)}
function finish(win){s.ended=true;if(win){const reward=s.contract==='cache'&&s.cacheLooted?6:s.contract==='relic'&&s.relicLooted?10:0;s.warehouse+=s.loot+reward;s.contractDone=reward>0;s.expeditions++;s.message='生還！ 素材'+s.loot+'個を倉庫へ運んだ。'+(reward?'依頼達成報酬+'+reward+'個。':'')+'次の遠征で支柱の跡を再発見できる。'}else{s.message='撤退。手持ち素材'+s.loot+'個を失った。'}s.loot=0;save();render()}
function move(k){
 if(s.ended||s.carryStrain||s.stalker==='high'||!near(s.pos,k)||!walkable(k))return;
 const from=s.pos;
 s.pos=k;if(!s.seen.includes(k))s.seen.push(k);
 if(k===SURVEY&&s.clueBeacon&&!s.clueBonusUsed){s.clueBonusUsed=true;s.loot+=2;s.message='前回設置した測量標が新たな資材を指し示した。素材2個を回収！';save();render();return}
 if(k===SURVEY&&s.minerRescued&&!s.minerSupplied){s.message='以前救った坑夫が補給所を用意してくれた。HPを1回復するか、素材2個を受け取れる。';save();render();return}
 if(k==='1,4'&&s.cartRepaired&&!s.cartUsed){s.cartUsed=true;s.loot+=2;s.message='修理した廃鉱車から補給資材2個を回収。以前の投資が遠征の準備を助けた。';save();render();return}
 if(k==='2,4'&&!s.gapBridge&&!s.gapLooted){s.gapLooted=true;s.loot+=4;s.message='危険な谷を越え、対岸の資材4個を発見！ 素材3個で恒久橋を架ければ次の遠征から安全に通れる。';save();render();return}
 if(k==='3,2'&&s.passBlocked){s.stalker='defeated';s.message='以前封鎖した獣道のおかげで、追跡獣の奇襲を避けて通れた。';save();render();return}
 if(k==='3,2'&&s.stalker==='unseen'&&s.trapReady){s.trapReady=false;s.trapTriggered=true;s.stalker='defeated';s.loot+=4;s.message='前回設置した罠が作動！ 追跡獣を退け、素材4個を確保。再訪の準備が報われた。';save();render();return}
 if(k==='3,2'&&s.stalker==='unseen'){s.stalker='warning';s.message='暗がりから足音。立ち止まって予兆を聞くか、先へ進むか。';save();render();return}
 if(s.stalker==='warning'&&k!=='3,2'){s.hp-=2;s.stalker='struck';s.message='追跡獣が背後から襲った！ HP-2。足音を調べれば奇襲を避けられた。';if(s.hp<=0){finish(false);return}save();render();return}
 if(k===ROCK&&s.fragileCrystal&&!s.crystalWrapped){s.loot=Math.max(0,s.loot-6);s.fragileCrystal=false;s.message='星晶が狭い岩場で割れた！ 素材6個を失った。次は梱包するか滑車搬出を考えよう。';save();render();return}
 if(k===ROCK&&s.loot>=12&&!s.carryResolved&&!s.safeLedge&&!(from==='2,4'&&s.gapBridge)&&s.hp>2){s.carryStrain=true;s.message='重い戦利品が狭い帰路に引っかかった！ 素材5個を捨てるか、HP2を使って強行突破するか。決めるまで移動できない。';save();render();return}
 if(k===ROCK&&from==='2,4'&&s.gapBridge&&s.loot>=12&&!s.carryResolved){s.carryResolved=true;s.message='恒久橋から荷運び道へ回り込み、重い戦利品を失わずに狭い帰路を迂回した！';save();render();return}
 if(k===FLOOD&&s.floodSurge&&!s.valveSealed){s.hp-=2;s.floodSurge=false;s.message='開いた水門から濁流が噴き出した！ HP-2。';if(s.hp<=0){finish(false);return}save();render();return}
 if(k===ROCK&&s.rockfall&&!s.braced&&!s.escaped){
   if(s.sensorCharge){s.sensorCharge=false;s.rockfall=false;s.message='探知器が落石を予告！ 安全な岩陰へ退避してHPを守った。次の遠征で再充電される。';save();render();return}
   s.hp-=2;s.message='落石が帰路を直撃！ HP-2。';s.rockfall=false;
   if(s.hp<=0){finish(false);return}
 }else if(k==='3,2'&&s.stalker==='warning')s.message='獣の足音が近い。聞き分けて対処しよう。';
 else if(k===NEST)s.message='追跡獣の巣。巣の宝を奪うか、素材を使って帰路の近道を作るか。';
 else if(k===ORE)s.message='鉱脈に到達。浅く掘るか、危険な深部へ進むか。';
 else if(k===TRACE&&s.expeditions>0&&!s.cacheFound)s.message='以前の遠征では見落とした風の流れ。壁の向こうに空洞がありそうだ。';
 else if(k==='3,0')s.message='縄梯子の先に古い補給庫。残った物資を回収するか、薬草で体力を戻すか。どちらか一度だけ。';
 else if(k==='3,3'&&!s.resonanceSolved)s.message='二本の石柱が違う音を返す。岩壁の傷は「低→高→低」の順番。音階を調べて共鳴させよう。';
 else if(k==='3,3')s.message=s.echoReady&&!s.echoCollected?'前回刻んだ印の下から鉱脈の音がする。HPを使って採掘できる。':!s.echoMarked?'岩壁の奥に規則的な反響。記録すれば次の遠征で鉱脈を見つけられそうだ。':'記録した反響は次の遠征で確かめよう。';
 else if(k===GROVE)s.message='胞子が周期的に舞う茸洞窟。流れを読んで慎重に採るか、奥の大株を狙うか。';
 else if(k==='4,4')s.message='最深部の古代鉱石。回収すれば水門の水圧が上がる。';
 else if(k==='4,3')s.message=s.pressureOpened?'水圧で開いた水晶洞。素材を回収して生還しよう。':'水門の先に乾いた旧坑道が続いている。壁の水圧に周期的な脈動がある。';
 else if(k===FLOOD)s.message='水没横穴。足場は脆いが沈んだ遺物が見える。';
 else if(k===CACHE)s.message='隠し鉱室を発見。希少な結晶を持ち帰れる。';
 else if(k===SURVEY&&!s.surveyed)s.message='壁に亀裂がある。調査すれば崩落路の支柱を組める。';
 else s.message='坑道を一歩進んだ。';
 if(k===VAULT)s.message='封印庫の石盤。永久に役立つ古代羅針盤か、今すぐ持ち帰る結晶を選ぼう。';
 if(k===HOME&&s.seen.length>1){finish(true);return}
 save();render();
}
function render(){
 el('stats').textContent='HP '+s.hp+'/5 ・ 手持ち '+s.loot+' ・ 倉庫 '+s.warehouse;
 el('status').textContent=s.message;
 const board=el('map');board.replaceChildren();
 for(let y=0;y<5;y++)for(let x=0;x<5;x++){
  const k=x+','+y,visible=(k!=='2,4'||s.gapCrossed||s.gapBridge)&&(k!==CACHE||s.cacheFound)&&(k!=='3,0'||s.rope)&&(k!==VAULT||s.vaultOpen)&&(k!==FLOOD||s.floodOpen)&&(k!==GROVE||s.lantern)&&(k!=='4,3'&&k!=='4,4'||s.valveOpen)&&(s.seen.includes(k)||near(s.pos,k)),can=!s.ended&&!s.carryStrain&&s.stalker!=='high'&&visible&&near(s.pos,k)&&walkable(k);

act('oreListen',()=>!s.ended&&s.pos===ORE&&!s.mined&&!s.oreListened,()=>{s.oreListened=true;s.message='壁の鳴動を聞き分けた。左の鉱脈は安定している（素材5・無傷）、右は深いが落石の危険がある（素材8・HP-2）。';});
act('oreSafe',()=>!s.ended&&s.pos===ORE&&!s.mined&&s.oreListened,()=>{s.mined=true;s.loot+=5;s.message='鳴動の静かな鉱脈を狙い、素材5個を安全に採掘した。落石は起きない。さらに奥を追い掘りするか帰還しよう。';});
act('mine',()=>s.pos===ORE&&!s.mined&&!s.ended,()=>{s.mined=true;s.loot+=3;s.message='浅い鉱脈から素材3個。帰ろう。'});
act('deep',()=>s.pos===ORE&&!s.mined&&s.hp>2&&!s.ended,()=>{s.mined=true;s.deep=true;s.hp-=2;s.loot+=8;s.rockfall=true;s.message='深部から素材8個！ 落石が始まった。素材を使って帰路を補強するか、荷を捨てて回避するか、危険なまま戻るか。'});
act('followMine',()=>!s.ended&&s.pos===ORE&&s.mined&&!s.deep&&!s.followMined&&s.hp>2,()=>{s.followMined=true;s.deep=true;s.hp-=2;s.loot+=6;s.rockfall=true;s.message='浅掘りの奥に新たな鉱脈！ 追加素材6個を確保したがHP-2、帰路に落石が発生。今から補強するか危険を承知で帰るか選ぼう。';});
act('brace',()=>s.pos===ORE&&s.rockfall&&!s.braced&&s.loot>=2&&!s.ended,()=>{s.loot-=2;s.braced=true;s.message='素材2個で帰路を補強。落石の被害を避けられる。'});
act('escape',()=>s.pos===ORE&&s.rockfall&&!s.escaped&&s.loot>=3&&!s.ended,()=>{s.loot-=3;s.escaped=true;s.message='荷物3個を置いて落石をやり過ごした。帰還しよう。'});
act('anchor',()=>!s.ended&&s.pos===ROCK&&!s.anchorReady&&!s.carryStrain&&s.loot>=4,()=>{s.loot-=4;s.anchorReady=true;s.message='素材4個で岩陰に滑車を固定。隠し鉱室から素材2個を払って安全に戦利品を搬出できる。今回は帰還か追加探索かを選べる。';});
act('anchorReturn',()=>!s.ended&&s.pos===CACHE&&s.anchorReady&&s.loot>=2,()=>{s.loot-=2;s.anchorReady=false;s.pos=HOME;finish(true);});
act('stash',()=>!s.ended&&s.pos===ROCK&&!s.carryStrain&&s.loot>=5&&s.hiddenStash===0,()=>{s.loot-=5;s.hiddenStash=5;s.message='岩陰に素材5個を隠した。今回失敗しても残るが、回収には再びここへ来なければならない。';});
act('retrieveStash',()=>!s.ended&&s.pos===ROCK&&!s.carryStrain&&s.hiddenStash>0,()=>{s.loot+=s.hiddenStash;s.message='隠した素材'+s.hiddenStash+'個を回収。生還するまで倉庫には入らない。';s.hiddenStash=0;});
act('camp',()=>!s.ended&&s.pos===ROCK&&!s.camped&&s.loot>=2&&s.hp<5,()=>{s.loot-=2;s.hp=Math.min(5,s.hp+2);s.camped=true;s.message='岩陰に小さな野営地を作った。素材2個を消費してHPを2回復。今回の遠征ではもう休めない。';});
act('flood',()=>s.pos===TRACE&&!s.floodOpen&&s.loot>=2&&!s.ended,()=>{s.loot-=2;s.floodOpen=true;s.message='素材2個で水路に足場を渡した。南の水没横穴が開いた。';});
act('valve',()=>!s.ended&&s.pos===FLOOD&&!s.valveOpen&&s.loot>=3,()=>{s.loot-=3;s.valveOpen=true;s.message='素材3個で錆びた水門を開いた。南の旧坑道が通れるようになった。';});
act('pressureRead',()=>!s.ended&&s.pos==='4,3'&&s.valveOpen&&!s.pressureRead,()=>{s.pressureRead=true;s.message='壁の水圧は三拍ごとに弱まる。素材2個で導水管を作ればHP1で壁を開けられる。無理なら今は帰還できる。';});
act('pressureTap',()=>!s.ended&&s.pos==='4,3'&&s.pressureRead&&!s.pressureOpened&&s.loot>=2&&s.hp>1,()=>{s.loot-=2;s.hp--;s.pressureOpened=true;s.message='脈動に合わせて導水管を差し込み、隠し水晶洞を開いた！ HP-1。採掘するか安全に引き返すか選べる。';});
act('pressureCollect',()=>!s.ended&&s.pos==='4,3'&&s.pressureOpened&&!s.pressureCollected&&s.hp>1,()=>{s.hp--;s.loot+=8;s.pressureCollected=true;s.message='水晶洞で希少素材8個を採集！ HP-1。帰還できれば倉庫に残る。';});
act('seal',()=>!s.ended&&s.pos==='4,3'&&s.floodSurge&&!s.valveSealed&&s.loot>=2,()=>{s.loot-=2;s.valveSealed=true;s.message='素材2個で水門を固定。濁流を防いだ。';});
act('relic',()=>!s.ended&&s.pos==='4,4'&&!s.relicLooted&&s.hp>1,()=>{s.hp--;s.loot+=9;s.relicLooted=true;s.floodSurge=true;s.message='古代鉱石9個を回収！ HP-1。水圧が増した。帰路の水門を補強するか、濁流を受けるか。';});
act('salvage',()=>s.pos===FLOOD&&!s.floodLooted&&s.hp>1&&!s.ended,()=>{s.floodLooted=true;s.hp--;s.loot+=5;s.message='水底から遺物素材5個を引き上げた。冷水でHP-1。生還して初めて倉庫に入る。';});
act('trace',()=>s.pos===TRACE&&s.expeditions>0&&!s.cacheFound&&!s.ended,()=>{s.cacheFound=true;s.message='壁の隙間から隠し鉱室への通路を見つけた。北の一歩が開いた。'});
act('echo',()=>!s.ended&&s.pos===TRACE&&!s.cacheFound&&s.hp>2,()=>{s.hp-=2;s.cacheFound=true;s.message='壁に耳を当て、崩れかけた岩を手探りで抜いた。HP-2。北の隠し鉱室が開いた。素材を使わず危険を選んだ。';});
act('probe',()=>!s.ended&&s.pos===TRACE&&s.expeditions===0&&!s.cacheFound&&s.loot>=4,()=>{s.loot-=4;s.cacheFound=true;s.message='素材4個を使って風の通り道を掘り当てた！ 初回遠征でも北の隠し鉱室へ進める。素材を残して帰るか、結晶を狙うか。'});
act('fragileCrystal',()=>!s.ended&&s.pos===CACHE&&!s.cacheLooted&&s.hp>2,()=>{s.hp-=2;s.loot+=12;s.cacheLooted=true;s.fragileCrystal=true;s.message='脆い星晶12個を採掘！ HP-2。岩陰を通ると6個が割れる。素材3個で梱包するか、滑車を使って搬出しよう。';});
act('wrapCrystal',()=>!s.ended&&s.pos===CACHE&&s.fragileCrystal&&!s.crystalWrapped&&s.loot>=3,()=>{s.loot-=3;s.crystalWrapped=true;s.message='素材3個で星晶を梱包。狭い岩場でも破損しなくなった。';});
act('cacheDeep',()=>!s.ended&&s.pos===CACHE&&!s.cacheLooted&&s.hp>2,()=>{s.cacheLooted=true;s.hp-=2;s.loot+=10;s.message='結晶脈の奥まで掘り進めた！ HP-2、希少結晶10個。帰路に耐えられるか判断しよう。';});
act('cache',()=>s.pos===CACHE&&!s.cacheLooted&&!s.ended&&s.hp>1,()=>{s.cacheLooted=true;s.hp--;s.loot+=6;s.message='希少結晶6個を確保。HP-1。生還すれば倉庫に持ち帰れる。'});
act('rope',()=>!s.ended&&s.pos===CACHE&&!s.rope&&s.loot>=3,()=>{s.loot-=3;s.rope=true;s.message='素材3個で結晶坑に縄梯子を架けた。西の新しい道から鉱脈へ抜けられる。次の遠征でも使える。';});
act('vault',()=>!s.ended&&s.pos==='3,0'&&!s.vaultOpen&&s.loot>=3,()=>{s.loot-=3;s.vaultOpen=true;s.message='素材3個で封印庫の石扉を開けた。西の隠し部屋へ進める。';});
act('vaultCompass',()=>!s.ended&&s.pos===VAULT&&!s.vaultClaimed,()=>{s.vaultClaimed=true;s.ancientCompass=true;s.message='古代羅針盤を確保！ 次回以降の遠征で亀裂調査から追加素材2個を発見できる。';});
act('vaultCrystal',()=>!s.ended&&s.pos===VAULT&&!s.vaultClaimed&&s.hp>2,()=>{s.vaultClaimed=true;s.hp-=2;s.loot+=8;s.message='危険な結晶採掘に成功。HP-2、素材8個。羅針盤は手に入らない。';});
act('supply',()=>!s.ended&&s.pos==='3,0'&&!s.supplyUsed,()=>{s.supplyUsed=true;s.loot+=4;s.message='旧補給庫から素材4個を確保。手当用の薬草は残さなかった。生還すれば倉庫に入る。';});
act('restock',()=>!s.ended&&s.pos==='3,0'&&!s.supplyUsed&&s.hp<5,()=>{s.supplyUsed=true;s.hp=Math.min(5,s.hp+2);s.message='旧補給庫の薬草でHPを2回復。資材は回収できなくなった。';});
act('spores',()=>!s.ended&&s.pos===GROVE&&!s.groveLooted&&!s.sporesRead,()=>{s.sporesRead=true;s.message='胞子は一定の間隔で渦を作る。縁なら無傷で素材2個、中心の大株ならHP-2で素材7個。どちらか一度だけ。';});
act('harvestSafe',()=>!s.ended&&s.pos===GROVE&&!s.groveLooted&&s.sporesRead,()=>{s.groveLooted=true;s.loot+=2;s.message='胞子の切れ目を見極め、無傷で素材2個を採集。奥の大株は残した。';});
act('harvestRisk',()=>!s.ended&&s.pos===GROVE&&!s.groveLooted&&s.sporesRead&&s.hp>2,()=>{s.groveLooted=true;s.hp-=2;s.loot+=7;s.message='胞子の渦を突っ切り大株を採集！ HP-2、素材7個。帰還できるか判断しよう。';});
act('rockSensor',()=>s.ended&&s.warehouse>=5&&!s.rockSensor,()=>{s.warehouse-=5;s.rockSensor=true;s.message='落石探知器を製作。次回から各遠征1回、深掘り後の帰路の落石を無傷で回避できる。';});
act('lantern',()=>s.ended&&s.warehouse>=4&&!s.lantern,()=>{s.warehouse-=4;s.lantern=true;s.message='燐光ランタンを製作。次回から岩陰の茸洞窟へ進める。';});
act('reinforce',()=>s.ended&&s.warehouse>=6&&!s.reinforced,()=>{s.warehouse-=6;s.reinforced=true;s.message='倉庫の素材6個で坑道の支柱を恒久補強。次回から調査・支柱作りなしで奥へ進める。'});
el('extract').onclick=()=>{if(s.ended||s.pos!==ORE||s.loot<4||s.extractUsed)return;s.loot-=4;s.extractUsed=true;s.pos=HOME;finish(true);};
el('evacuate').onclick=()=>{if(s.ended||s.pos===HOME||s.hp>1||s.loot<=0||s.carryStrain)return;const lost=Math.ceil(s.loot/2);s.loot-=lost;s.pos=HOME;finish(true);s.message='負傷撤収。素材'+lost+'個を放棄し、残りを倉庫へ持ち帰った。';save();render()};
el('retreat').onclick=()=>{if(!s.ended)finish(false)};
el('again').onclick=()=>{if(!s.ended)return;const {clueBeacon,minerRescued,hiddenStash,warehouse,expeditions,reinforced,winchBuilt,oreVentBuilt,gapBridge,cartRepaired,nestOpened,nestReward,nestShortcut,passBlocked,safeLedge,lantern,rope,cacheFound,floodOpen,valveOpen,pressureOpened,pressureCollected,trapReady,vaultOpen,vaultClaimed,ancientCompass,rockSensor,resonanceSolved,resonanceCollected,echoMarked,echoCollected}=s;s=fresh();s.clueBeacon=clueBeacon;s.minerRescued=minerRescued;s.hiddenStash=hiddenStash;s.warehouse=warehouse;s.expeditions=expeditions;s.reinforced=reinforced;s.winchBuilt=winchBuilt;s.oreVentBuilt=oreVentBuilt;s.gapBridge=gapBridge;s.cartRepaired=cartRepaired;s.nestOpened=nestOpened;s.nestReward=nestReward;s.nestShortcut=nestShortcut;s.passBlocked=passBlocked;s.safeLedge=safeLedge;s.lantern=lantern;s.rope=rope;s.cacheFound=cacheFound;s.floodOpen=floodOpen;s.valveOpen=valveOpen;s.pressureOpened=pressureOpened;s.pressureCollected=pressureCollected;s.trapReady=trapReady;s.vaultOpen=vaultOpen;s.vaultClaimed=vaultClaimed;s.ancientCompass=ancientCompass;s.rockSensor=rockSensor;s.sensorCharge=rockSensor;s.resonanceSolved=resonanceSolved;s.resonanceCollected=resonanceCollected;s.echoMarked=echoMarked;s.echoCollected=echoCollected;s.echoReady=echoMarked&&!echoCollected;save();render()};
render();
</script></html>
