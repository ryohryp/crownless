<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crownless | 雷雲の渡し</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a20;color:#f4efdf;font:16px system-ui}main{max-width:430px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:12px 12px max(14px,env(safe-area-inset-bottom));gap:8px}h1{font-size:21px;margin:0}#status{font-weight:bold;font-size:14px}#map{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;flex:1;min-height:0} .tile{border:1px solid #6e8687;border-radius:9px;background:#26383d;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:4px;font-size:14px}.here{outline:3px solid #f1c46c}.storm{background:#5d384b}.unknown{background:#1b292e;color:#b0bcb8}#story{min-height:48px;line-height:1.35;font-size:14px}#actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:35dvh;overflow-y:auto}button{min-height:49px;border:1px solid #b8bc86;border-radius:9px;background:#315b56;color:white;font:600 15px system-ui;padding:8px}button:disabled{opacity:.35}button.warn{background:#774d3e}small{font-size:12px;color:#b9c8c6}
</style>
<main><h1>⛈️ 雷雲の渡し</h1><div id="status"></div><div id="map" aria-label="探索マップ"></div><div id="story" role="status"></div><div id="actions"></div><small>実験ステージ。雷雲は行動ごとに移動。帰還して初めて素材を倉庫へ保管します。</small></main>
<script>
'use strict';
const KEY='crownless-storm-crossing-v1',N=9,exits=[0,1,2];
const initial=()=>({phase:'camp',hp:10,bank:0,bag:0,pos:7,turn:0,seen:[7],taken:[],boots:false,run:0,groundedUntil:0,chargedTaken:false,coreTaken:false,cache:0,cacheRun:-1,divertUntil:0,traceFound:false,traceTaken:false,shelterBuilt:false,shelterUsed:false,commission:false,commissionWins:0,raiderDefeated:false,raiderAlert:false});
let s;try{s=Object.assign(initial(),JSON.parse(localStorage.getItem(KEY))||{})}catch{s=initial()}
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function act(label,fn,kind=''){let b=document.createElement('button');b.textContent=label;b.className=kind;b.onclick=()=>{fn();persist();render()};$('actions').append(b)}
function stormAt(t){return t<s.groundedUntil?-1:(t<s.divertUntil?[0,3,6]:[1,4,7])[t%3]}
function neighbors(p){return [p-3,p+3,p%3? p-1:-1,p%3<2?p+1:-1].filter(v=>v>=0&&v<N)}
function hazard(){if(stormAt(s.turn)===s.pos){s.hp-=s.boots?1:3;if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost'}}}
function waitTurn(){s.turn++;hazard()}
function step(p){if(!neighbors(s.pos).includes(p))return;s.pos=p;s.turn++;if(!s.seen.includes(p))s.seen.push(p);hazard();if(s.phase==='field'&&p===5&&!s.raiderDefeated)s.raiderAlert=true}
function begin(){s.phase='field';s.hp=10;s.bag=0;s.pos=7;s.turn=0;s.seen=[7];s.taken=[];s.groundedUntil=0;s.divertUntil=0;s.chargedTaken=false;s.coreTaken=false;s.traceFound=false;s.traceTaken=false;s.shelterUsed=false;s.raiderDefeated=false;s.raiderAlert=false;s.run++}
function returnHome(){const delivered=s.bag;const bonus=s.commission&&delivered>=12?6:0;s.bank+=delivered+bonus;if(bonus){s.commission=false;s.commissionWins=(s.commissionWins||0)+1}s.bag=0;s.phase='camp'}
function render(){
$('actions').replaceChildren();
$('status').textContent='HP '+s.hp+'/10 · 持ち歩き '+s.bag+' · 倉庫 '+s.bank+' · 遠征 '+s.run+(s.boots?' · 絶縁靴':'')+(s.phase==='field'&&s.turn<s.groundedUntil?' · 避雷塔接地中':'')+(s.phase==='field'&&s.turn<s.divertUntil?' · 雷雲誘導中':'')+(s.cache?' · 遺跡の保管鉱石 '+s.cache:'')+(s.commission?' · 納品依頼12個→報酬6個':'')+(s.commissionWins?' · 納品達成 '+s.commissionWins+'回':'');
const map=$('map');map.replaceChildren();
for(let p=0;p<N;p++){let el=document.createElement('div');el.className='tile'+(p===s.pos&&s.phase==='field'?' here':'')+(s.phase==='field'&&stormAt(s.turn)===p?' storm':'')+(s.phase==='field'&&!s.seen.includes(p)?' unknown':'');const labels=['北西の石橋','避雷塔','北東の遺跡','西の岩棚','水没道','東の鉱脈','南西の避難岩','渡し場','南東の避難岩'];el.textContent=s.phase==='field'&&!s.seen.includes(p)?'？':labels[p];if(s.phase==='field'&&stormAt(s.turn)===p)el.textContent+=' ⚡';if(s.phase==='field'&&p===s.pos)el.textContent+=' 🧍';map.append(el)}
if(s.phase==='camp'){$('story').textContent='遠征で鉱石を持ち帰ろう。納品依頼は持ち帰った鉱石12個以上で達成。倉庫の鉱石は対象外、失敗しても依頼は残る。';if(!s.commission)act('鉱石12個の納品依頼を受ける（生還で報酬+6）',()=>{s.commission=true});act('遠征に出る',begin);if(!s.boots&&s.bank>=4)act('素材4で絶縁靴を作る',()=>{s.bank-=4;s.boots=true});act('実験データを初期化',()=>{s=initial()},'warn');return}
if(s.phase==='lost'){$('story').textContent='雷雲に倒れた。持ち歩いていた素材は失った。倉庫は無事。';act('再挑戦',begin);return}
const p=s.pos, storm=stormAt(s.turn);
if(p===5&&s.raiderAlert&&!s.raiderDefeated){$('story').textContent='東の鉱脈で伏兵の足音。攻撃の予兆が見える。身を隠してやり過ごすか、HPを賭けて反撃し鉱石を奪うか。';act('岩陰に隠れる（1行動 / HP-1）',()=>{s.hp-=1;s.turn++;s.raiderAlert=false;if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost';return}hazard()});act('伏兵を迎撃（HP-3 / 鉱石+6）',()=>{s.hp-=3;s.turn++;s.raiderDefeated=true;s.raiderAlert=false;if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost';return}s.bag+=6;hazard()},'warn');return}

$('story').textContent='雷雲は中央の縦列を南北に巡る。南西・南東の岩陰では1手待って雷雲をやり過ごせる。中央の水没道には希少鉱石6個。避雷塔で素材2個を使えば次の3行動を安全にできる。接地中に中央へ到達すれば帯電結晶の安全回収か、HP4を賭けた雷核採掘（素材+8）かを選べる。東の鉱脈で素材2個を使うと雷雲を西列へ3行動誘導できる（西側は危険になる）。北東の遺跡には鉱石を隠し、次の遠征で回収できる。北西の石橋では足跡を調べて隠し鉱脈を発見できる。西の岩棚では素材4個で恒久的な雨よけを建設し、遠征ごとに一度HPを3回復できる。落雷直前の鉱脈で採集すると追加素材+4。ただし採集にも1行動かかり、落雷を受ける。⚡は現在の危険地帯。';
if(p===0&&!s.traceFound)act('石橋の傷跡を調べる（隠し鉱脈を発見）',()=>{s.traceFound=true;s.turn++;hazard()});
if(p===0&&s.traceFound&&!s.traceTaken)act('崩れた橋下で希少鉱石を採掘（HP-3 / 素材+7）',()=>{s.traceTaken=true;s.hp-=3;s.turn++;if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost';return}s.bag+=7;hazard()},'warn');
if(p===2&&s.bag>0&&s.cache===0)act('遺跡に鉱石を隠す（次の遠征で回収）',()=>{s.cache=s.bag;s.bag=0;s.cacheRun=s.run;s.turn++;hazard()});
if(p===2&&s.cache>0&&s.cacheRun<s.run)act('前回隠した鉱石を回収 +'+s.cache,()=>{s.bag+=s.cache;s.cache=0;s.turn++;hazard()});
if(p===5&&s.bag>=2&&s.turn>=s.divertUntil)act('誘導杭を設置（素材-2 / 雷雲を西へ3行動）',()=>{s.bag-=2;s.divertUntil=s.turn+4;s.turn++;hazard()});
if(p===3&&!s.shelterBuilt&&s.bag>=4)act('岩棚に雨よけを築く（素材-4 / 次の遠征にも残る）',()=>{s.bag-=4;s.shelterBuilt=true;s.turn++;hazard()});
if(p===3&&s.shelterBuilt&&!s.shelterUsed&&s.hp<10)act('雨よけで手当て（HP+3 / 1遠征1回）',()=>{s.shelterUsed=true;s.hp=Math.min(10,s.hp+3);s.turn++;hazard()});
if(p===6||p===8)act('岩陰で雷雲を1手やり過ごす',waitTurn);
if(p===1&&s.turn>=s.groundedUntil&&s.bag>=2)act('素材2で避雷塔を接地（次の3行動は雷雲停止）',()=>{s.bag-=2;s.groundedUntil=s.turn+4});
for(const q of neighbors(p))act('→ '+['北西','避雷塔','北東','西','中央','鉱脈','南西','渡し場','南東'][q]+'へ',()=>step(q),stormAt(s.turn+1)===q?'warn':'');
if(p===4&&s.turn<s.groundedUntil&&!s.coreTaken)act('雷核を掘り出す（HP-4 / 素材+8）',()=>{s.hp-=4;s.coreTaken=true;s.turn++;if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost';return}s.bag+=8;hazard()},'warn');
if(p===4&&s.turn<s.groundedUntil&&!s.chargedTaken)act('帯電結晶を回収 +5（接地中限定）',()=>{s.bag+=5;s.chargedTaken=true;s.turn++;hazard()});
const loot={0:2,2:3,3:2,4:6,5:4};
if(loot[p]&&!s.taken.includes(p)){const imminent=stormAt(s.turn+1)===p;act('鉱石を採集 +'+loot[p]+(imminent?'（落雷直前の鉱脈：追加+4）':''),()=>{s.bag+=loot[p]+(imminent?4:0);s.taken.push(p);s.turn++;hazard()},imminent?'warn':'')}
if(p===7)act('渡し場から生還する',returnHome);
if(exits.includes(p))act('岸沿いに撤退（素材を捨てる）',()=>{s.bag=0;s.phase='camp'},'warn');
}
render();
</script></html>
