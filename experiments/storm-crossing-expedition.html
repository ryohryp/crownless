<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crownless | 雷雲の渡し</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 20%,#293b45,#090e17 72%);color:#f4efdf;font:16px system-ui}main{max-width:430px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:12px 12px max(14px,env(safe-area-inset-bottom));gap:8px}h1{font-size:21px;margin:0}#status{font-weight:bold;font-size:14px}#map{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1;min-height:170px;max-height:49dvh;padding:8px;background:linear-gradient(145deg,#172e3a,#172027);border:2px solid #a18c60;border-radius:14px;box-shadow:0 10px 40px #0008}.tile{position:relative;overflow:hidden;border:2px solid #52685e;border-radius:9px;background:linear-gradient(145deg,#506254,#263c39 55%,#182d34);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:5px;font-size:11px;gap:3px;color:#e5e3cc;min-width:0;min-height:0}.tile .glyph{font-size:clamp(22px,8vw,39px);filter:drop-shadow(0 4px 2px #0008)}.tile .name{font-size:11px;text-shadow:0 2px 3px #000}.tile.reachable{border-color:#d3bc77;cursor:pointer;box-shadow:inset 0 0 0 1px #e5d6a366}.tile.reachable:active{transform:scale(.96)}.tile.here{outline:3px solid #ffdb80;z-index:1;background:linear-gradient(145deg,#627c60,#345046)}.tile.storm{background:linear-gradient(135deg,#50365f,#9b5260,#3d345f);animation:stormPulse 1.5s infinite alternate}.tile.unknown{background:repeating-linear-gradient(135deg,#15252c,#15252c 8px,#1a3035 8px,#1a3035 16px);color:#8ca3a1}.tile.unknown .glyph{filter:blur(2px)}.tile{isolation:isolate}.tile::before{content:'';position:absolute;inset:0;z-index:-1;opacity:.24;background:repeating-linear-gradient(0deg,transparent 0 7px,#b5c3a8 7px 8px),repeating-linear-gradient(90deg,transparent 0 7px,#0b1c22 7px 8px);pointer-events:none}.tile.reachable::after{content:'➜';position:absolute;right:5px;top:2px;color:#ffe09c;font-size:17px}.tile.storm{box-shadow:inset 0 0 0 3px #ffbd79,0 0 12px #e68e7c}.tile.here .name{color:#fff0b8;font-weight:800}@keyframes stormPulse{to{filter:brightness(1.3)}}#story{min-height:56px;max-height:82px;overflow:auto;line-height:1.45;font-size:14px;padding:9px 12px;background:#17232bd9;border-left:3px solid #c9aa65;border-radius:4px}#actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:23dvh;overflow-y:auto}button{min-height:49px;border:1px solid #b8bc86;border-radius:9px;background:#315b56;color:white;font:600 15px system-ui;padding:8px}button:disabled{opacity:.35}button.warn{background:#774d3e}small{font-size:12px;color:#b9c8c6}
</style>
<main><h1>⚔️ 雷鳴の辺境 <small>— 生きて帰れ —</small></h1><div id="status"></div><div id="map" aria-label="探索マップ"></div><div id="story" role="status"></div><div id="actions"></div><small>金色の縁のマスをタップして移動。危険を冒して秘宝を持ち帰ろう。</small></main>
<script>
'use strict';
const KEY='crownless-storm-crossing-v1',N=9,exits=[0,1,2];
const initial=()=>({phase:'camp',hp:10,bank:0,bag:0,pos:7,turn:0,seen:[7],taken:[],boots:false,compass:false,run:0,groundedUntil:0,chargedTaken:false,coreTaken:false,cache:0,cacheRun:-1,divertUntil:0,decoyUntil:0,traceFound:false,traceTaken:false,shelterBuilt:false,shelterUsed:false,commission:false,commissionWins:0,flareStock:0,flareUsed:false,raiderDefeated:false,raiderAlert:false,raiderHp:6,raiderIntent:0,raiderGuard:false,raiderTrophies:0,raiderBlade:false,bridgeVaultOpen:false,bridgeVaultTaken:false,guardianDefeated:false,guardianHp:10,guardianTurn:0,guardianAlert:false,relic:false,relicShield:0,ruinsLiberated:false,ruinsRested:false,ruinsOffering:false,trailClue:false,trailCacheTaken:false,altarOpened:false,altarLooted:false,altarSigil:false,hunterScouted:false,hunterTrap:false,hunterDefeated:false,hunterAlert:false,hunterHp:8,hunterTurn:0,hunterFang:false,wolfFangs:0,wolfHook:false,cliffTrailFound:false,cliffCacheTaken:false,stormBeacon:false,stormCharge:0,stormReward:false,stormChaseFailed:false,scoutBoost:0,scoutFound:false,scoutEscorting:false,scoutHp:3,scoutRescued:false,scoutLost:false,scoutBandages:0,scoutCover:0,scoutCoverUsed:false,circuitStage:0,circuitDeadline:0,circuitWon:false,circuitFailed:false});
let s;try{s=Object.assign(initial(),JSON.parse(localStorage.getItem(KEY))||{})}catch{s=initial()}
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function act(label,fn,kind=''){let b=document.createElement('button');b.textContent=label;b.className=kind;b.onclick=()=>{fn();persist();render()};$('actions').append(b)}
function stormAt(t){return t<s.groundedUntil?-1:(t<s.decoyUntil?8:(t<s.divertUntil?[0,3,6]:[1,4,7])[t%3])}
function neighbors(p){return [p-3,p+3,p%3? p-1:-1,p%3<2?p+1:-1].filter(v=>v>=0&&v<N&&(!((p===0&&v===3)||(p===3&&v===0))||s.wolfHook&&s.cliffTrailFound))}
function hazard(){if(stormAt(s.turn)===s.pos){if(s.relicShield>0){s.relicShield--;return}s.hp-=s.boots?1:3;if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost'}}}
function chaseTick(){if(!s.stormBeacon||s.stormReward||s.stormChaseFailed)return;if(s.pos===stormAt(s.turn)){s.stormCharge++;if(s.stormCharge>=3){s.stormReward=true;s.bag+=14;s.stormBeacon=false}}}
function advance(){s.turn++;hazard();if(s.phase==='field')chaseTick()}
function scoutTick(){if(!s.scoutEscorting||s.phase!=='field')return;if(stormAt(s.turn)===s.pos){if(s.scoutCover>0){s.scoutCover--;return}s.scoutHp--;if(s.scoutHp<=0){s.scoutHp=0;s.scoutEscorting=false;s.scoutLost=true}}}
function waitTurn(){advance()}
function circuitTick(){if(s.phase!=='field'||!s.circuitStage)return;if(s.turn>s.circuitDeadline){s.circuitStage=0;s.circuitFailed=true;return}if(s.circuitStage===1&&s.pos===4){s.circuitStage=2}else if(s.circuitStage===2&&s.pos===6){s.circuitStage=3}else if(s.circuitStage===3&&s.pos===7){s.circuitStage=0;s.circuitWon=true;s.bag+=11}}
function step(p){if(s.phase!=='field'||s.raiderAlert&&!s.raiderDefeated||s.guardianAlert&&!s.guardianDefeated||!neighbors(s.pos).includes(p))return;s.pos=p;advance();scoutTick();circuitTick();for(const q of [p,...neighbors(p)])if(!s.seen.includes(q))s.seen.push(q);if(s.phase==='field'&&p===5&&!s.raiderDefeated)s.raiderAlert=true;if(s.phase==='field'&&p===2&&s.bridgeVaultOpen&&!s.guardianDefeated)s.guardianAlert=true}
function begin(){s.phase='field';s.hp=(s.altarSigil?12:10)+((s.scoutBoost||0)>0?4:0);if(s.scoutBoost>0)s.scoutBoost--;s.bag=0;s.pos=7;s.turn=0;s.seen=[4,6,7,8];s.taken=[];s.trailClue=false;s.trailCacheTaken=false;s.cliffTrailFound=false;s.cliffCacheTaken=false;s.stormBeacon=false;s.stormCharge=0;s.stormReward=false;s.stormChaseFailed=false;s.altarOpened=false;s.altarLooted=false;s.groundedUntil=0;s.divertUntil=0;s.chargedTaken=false;s.coreTaken=false;s.traceFound=false;s.traceTaken=false;s.shelterUsed=false;s.raiderDefeated=false;s.raiderAlert=false;s.raiderHp=6;s.raiderIntent=0;s.raiderGuard=false;s.flareUsed=false;s.bridgeVaultTaken=false;s.guardianDefeated=!!s.ruinsLiberated;s.ruinsRested=false;s.ruinsOffering=false;s.guardianHp=10;s.guardianTurn=0;s.guardianAlert=false;s.relicShield=s.relic?1:0;s.scoutFound=false;s.scoutEscorting=false;s.scoutHp=3;s.scoutLost=false;s.scoutCover=0;s.scoutCoverUsed=false;s.circuitStage=0;s.circuitDeadline=0;s.circuitWon=false;s.circuitFailed=false;s.run++}
function returnHome(){if(s.scoutEscorting&&s.scoutHp>0){s.scoutRescued=true;s.scoutEscorting=false;s.scoutBandages++;s.bag+=10}const delivered=s.bag;const bonus=s.commission&&delivered>=12?6:0;s.bank+=delivered+bonus;if(bonus){s.commission=false;s.commissionWins=(s.commissionWins||0)+1}s.bag=0;s.phase='camp'}
function render(){
$('actions').replaceChildren();
$('status').textContent='HP '+s.hp+'/'+(s.altarSigil?12:10)+' · 持ち歩き '+s.bag+' · 倉庫 '+s.bank+' · 遠征 '+s.run+(s.boots?' · 絶縁靴':'')+(s.compass?' · 雷雲予測器':'')+(s.raiderBlade?' · 略奪者の刃':'')+(s.wolfHook?' · 断崖鉤縄':'')+(s.wolfFangs?' · 狼牙 '+s.wolfFangs:'')+(s.relic?' · 雷紋の護符':'')+(s.relicShield?' · 落雷防護1回':'')+(s.raiderTrophies?' · 刀片 '+s.raiderTrophies:'')+(s.bridgeVaultOpen?' · 石橋の地下宝物庫を発見':'')+(s.flareStock?' · 帰還信号 '+s.flareStock:'')+(s.phase==='field'&&s.turn<s.groundedUntil?' · 避雷塔接地中':'')+(s.phase==='field'&&s.turn<s.divertUntil?' · 雷雲誘導中':'')+(s.cache?' · 遺跡の保管鉱石 '+s.cache:'')+(s.commission?' · 納品依頼12個→報酬6個':'')+(s.commissionWins?' · 納品達成 '+s.commissionWins+'回':'');
const map=$('map');map.replaceChildren();
const names=['崩れた石橋','雷の尖塔','忘却の遺跡','獣道の岩棚','沈んだ祭壇','盗賊の鉱脈','風よけの岩','帰還の渡し','古い道標'];
const glyphs=['🌉','🗼','🏚️','🌲','🗿','⛏️','🪨','⛺','🪧'];
for(let p=0;p<N;p++){
 const known=s.phase!=='field'||s.seen.includes(p),inCombat=s.raiderAlert&&!s.raiderDefeated||s.guardianAlert&&!s.guardianDefeated,reachable=s.phase==='field'&&!inCombat&&s.seen.includes(p)&&neighbors(s.pos).includes(p);
 const el=document.createElement('div');
 el.className='tile'+(p===s.pos&&s.phase==='field'?' here':'')+(s.phase==='field'&&stormAt(s.turn)===p?' storm':'')+(!known?' unknown':'')+(reachable?' reachable':'');
 const symbol=document.createElement('span');symbol.className='glyph';symbol.textContent=!known?'🌫️':glyphs[p];
 const name=document.createElement('span');name.className='name';name.textContent=!known?'未踏の地':names[p];
 el.append(symbol,name);
 if(s.phase==='field'&&stormAt(s.turn)===p){const mark=document.createElement('span');mark.textContent='⚡';mark.style.cssText='position:absolute;right:3px;top:2px';el.append(mark)}
 if(s.phase==='field'&&s.compass&&stormAt(s.turn+1)===p){const mark=document.createElement('span');mark.textContent='⏭⚡';mark.style.cssText='position:absolute;left:3px;top:2px';el.append(mark)}
 if(s.phase==='field'&&p===s.pos){const mark=document.createElement('span');mark.textContent='🧍';mark.style.cssText='position:absolute;bottom:4px;right:3px;font-size:22px';el.append(mark)}
 if(reachable){el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',names[p]+'へ移動');const go=()=>{step(p);persist();render()};el.addEventListener('click',go);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})}
 map.append(el)
}
if(s.phase==='camp'){$('story').textContent='遠征で鉱石を持ち帰ろう。納品依頼は持ち帰った鉱石12個以上で達成。倉庫の鉱石は対象外、失敗しても依頼は残る。';if(s.scoutRescued)$('story').textContent+=' 救出した斥候が野営地で包帯を作ってくれる。';if(s.scoutBandages>0)act('🩹 斥候の包帯で次の遠征HP+4（残り'+s.scoutBandages+'）',()=>{s.scoutBandages--;s.scoutBoost=(s.scoutBoost||0)+1});if(!s.commission)act('鉱石12個の納品依頼を受ける（生還で報酬+6）',()=>{s.commission=true});act('遠征に出る',begin);if(!s.boots&&s.bank>=4)act('素材4で絶縁靴を作る',()=>{s.bank-=4;s.boots=true});if(!s.compass&&s.bank>=5)act('素材5で雷雲予測器を作る（次の行動の落雷地点を表示）',()=>{s.bank-=5;s.compass=true});if(!s.raiderBlade&&s.raiderTrophies>=1&&s.bank>=4)act('⚔️ 刀片1と鉱石4で略奪者の刃を鍛造（斬撃+2）',()=>{s.raiderTrophies--;s.bank-=4;s.raiderBlade=true});if(!s.wolfHook&&s.wolfFangs>=1&&s.bank>=4)act('🪝 狼牙1と鉱石4で断崖鉤縄を鍛造（岩棚から石橋への隠し道を開く）',()=>{s.wolfFangs--;s.bank-=4;s.wolfHook=true});if(s.bank>=3&&s.flareStock<2)act('素材3で緊急帰還信号を作る（最大2個）',()=>{s.bank-=3;s.flareStock=(s.flareStock||0)+1});act('実験データを初期化',()=>{s=initial()},'warn');return}
if(s.phase==='lost'){$('story').textContent='雷雲に倒れた。持ち歩いていた素材は失った。倉庫は無事。';act('再挑戦',begin);return}
const p=s.pos, storm=stormAt(s.turn);
if(s.circuitStage){$('story').textContent='⚡ 雷の回路 '+(s.circuitStage===1?'第二の印：中央祭壇へ':s.circuitStage===2?'第三の印：南西の岩陰へ':'最終の印：帰還の渡しへ')+'。残り '+Math.max(0,s.circuitDeadline-s.turn)+' 行動。時間切れでも戦利品は失わない。';}
if(p===3&&s.hunterAlert&&!s.hunterDefeated){
 const intent=s.hunterTurn%3;
 const clue=['獣が低く身を沈めた。次は飛びかかり（4ダメージ）。','獣が岩棚を回り込む。次は爪撃（2ダメージ）。','獣が息を整えている。今が攻撃の好機。'][intent];
 $('story').textContent='🐺 岩棚の灰狼 HP '+s.hunterHp+'/8｜'+clue+(s.hunterTrap?' 罠で動きが鈍っている。':'');
 function hunterMove(choice){
  if(choice==='flee'){s.pos=6;s.hunterAlert=false;s.turn++;hazard();return}
  const damage=intent===0?4:intent===1?2:0;
  const hit=choice==='guard'?Math.max(0,damage-3):choice==='dodge'&&intent===0?0:damage;
  const attack=choice==='strike'?(intent===2?5:2)+(s.raiderBlade?2:0)+(s.hunterTrap?1:0):choice==='dodge'&&intent===0?2:0;
  s.hunterHp-=attack;s.hp-=hit;s.turn++;
  if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost';return}
  if(s.hunterHp<=0){s.hunterDefeated=true;s.hunterAlert=false;s.hunterFang=true;s.wolfFangs++;s.bag+=8}
  else s.hunterTurn++;
  hazard()
 }
 act('⚔️ 斬る（隙なら強打）',()=>hunterMove('strike'));
 act('🛡️ 防御（被害-3）',()=>hunterMove('guard'));
 act('💨 回避（飛びかかりに反撃）',()=>hunterMove('dodge'));
 act('🏃 南西へ撤退',()=>hunterMove('flee'),'warn');
 return
}
if(p===2&&s.guardianAlert&&!s.guardianDefeated){
 const stance=s.guardianTurn%3;
 const clues=['石像が雷槍を高く掲げた！ 次の攻撃は重い（4）。回避で背後を取れる。','石像が盾を正面に構えた。正面攻撃は弾かれる。側面へ回り込もう。','石像の胸の雷核が露出した！ 今なら大ダメージを与えられる。'];
 $('story').textContent='🗿 遺跡の雷衛兵 HP '+s.guardianHp+'/10｜'+clues[stance];
 function guardianMove(choice){
   if(choice==='flee'){s.guardianAlert=false;s.pos=1;s.turn++;hazard();return}
   const damage=stance===0?4:stance===1?2:0;
   let hit=choice==='guard'?Math.max(0,damage-3):choice==='dodge'?(stance===0?0:damage):damage;
   let attack=choice==='strike'?(stance===1?0:stance===2?5:2):choice==='dodge'&&stance===0?2:0;
   if(attack&&s.raiderBlade)attack+=2;
   s.guardianHp-=attack;s.hp-=hit;s.turn++;
   if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost';return}
   if(s.guardianHp<=0){s.guardianDefeated=true;s.ruinsLiberated=true;s.guardianAlert=false;s.relic=true;s.relicShield=1;s.bag+=5}
   else s.guardianTurn++;
   hazard()
 }
 act('⚔️ 雷核を斬る（隙を狙う）',()=>guardianMove('strike'));
 act('🛡️ 防御（被害-3）',()=>guardianMove('guard'));
 act('💨 回避・背後を取る',()=>guardianMove('dodge'));
 act('🏃 尖塔へ退く（素材を保持）',()=>guardianMove('flee'),'warn');
 return
}

if(p===5&&s.raiderAlert&&!s.raiderDefeated){
 const intents=['大振りの斧：次に4ダメージ。回避が有効','短剣の連撃：次に2ダメージ。防御が有効','体勢を崩した：次は攻撃しない。強打の好機'];
 const intent=s.raiderIntent%3;
 $('story').textContent='⚔️ 鉱脈の略奪者 HP '+s.raiderHp+'/6｜'+intents[intent]+'。敵の動きを読んで戦おう。';
 function duel(move){
   const damage=intent===0?4:intent===1?2:0;
   let hit=move==='guard'?Math.max(0,damage-3):move==='dodge'?(intent===0?0:damage+1):damage;
   if(move==='strike'){s.raiderHp-=(intent===2?4:2)+(s.raiderBlade?2:0)}
   if(move==='dodge'&&intent===0){s.raiderHp-=1}
   s.hp-=hit;s.turn++;
   if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost';return}
   if(s.raiderHp<=0){s.raiderDefeated=true;s.raiderAlert=false;s.bag+=6;s.raiderTrophies++;s.bridgeVaultOpen=true}
   else{s.raiderIntent++}
   hazard()
 }
 act('⚔️ 斬り込む（敵HP-'+(s.raiderBlade?'4 / 隙なら-6':'2 / 隙なら-4')+'）',()=>duel('strike'));
 act('🛡️ 盾を構える（被害-3）',()=>duel('guard'));
 act('💨 横へ回避（大振りを無効化・反撃）',()=>duel('dodge'));
 act('🏃 退く（HP-1 / 鉱石は得られない）',()=>{s.hp--;s.turn++;s.raiderAlert=false;s.pos=8;if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost';return}if(!s.seen.includes(8))s.seen.push(8);hazard()},'warn');
 return
}

$('story').textContent=({0:s.bridgeVaultOpen&&!s.bridgeVaultTaken?'略奪者が落とした鍵が、石橋の地下扉にぴったり合う。': '橋の石に古い爪痕がある。下に何か隠されているかもしれない。',1:'雷を引き寄せる尖塔。接地できれば祭壇への道が開ける。',2:s.ruinsLiberated?'解放した遺跡に青い泉が湧いた。遠征ごとに一度、傷を癒せる。':s.bridgeVaultOpen?'鍵が震え、遺跡の石像が目覚めた。':'誰もいない遺跡。瓦礫の奥には荷物を隠せそうな空洞がある。',3:'風の抜ける岩棚。ここに雨よけを作れば次の遠征にも役立ちそうだ。',4:'水底で青い光が脈打つ。雷の中に希少な結晶が眠っている。',5:'鉱脈に不自然な足跡。何者かが潜んでいる。',6:'岩陰は安全だ。雷の通過を待てる。',7:'渡し場の灯が揺れている。ここまで帰れば戦利品を持ち帰れる。',8:s.trailClue&&!s.trailCacheTaken?'道標の下に新しい土。獣道の痕跡がここへ続いている。':'古い道標が風に鳴る。岩陰で一息つけそうだ。'})[p];
// Optional high-risk altar: two actions under the moving storm, with a persistent reward on safe return.
if(p===4&&!s.altarOpened&&s.bag>=3)act('🔮 祭壇の封印を解く（素材-3 / 1行動）',()=>{
 s.bag-=3;s.altarOpened=true;s.turn++;hazard()
},'warn');
if(p===4&&s.altarOpened&&!s.altarLooted)act('💎 祭壇の深部から雷の印章を奪う（HP-2 / 素材+12）',()=>{
 s.hp-=2;s.turn++;
 if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost';return}
 s.altarLooted=true;s.bag+=12;hazard()
},'warn');

if(p===1&&!s.circuitStage&&!s.circuitWon&&!s.circuitFailed)act('⚡ 雷の回路を起動（7行動以内に祭壇→岩陰→渡し場 / 秘鉱+11）',()=>{s.circuitStage=1;s.circuitDeadline=s.turn+7;s.turn++;hazard()},'warn');
if(s.circuitStage)act('🏳️ 雷の回路を中断する',()=>{s.circuitStage=0;s.circuitFailed=true});
if(p===0&&!s.scoutFound&&!s.scoutRescued&&!s.scoutLost)act('🧭 崩れた橋で救難信号を調べる（負傷した斥候を発見）',()=>{s.scoutFound=true;s.turn++;hazard()});
if(p===0&&s.scoutFound&&!s.scoutEscorting&&!s.scoutLost&&!s.scoutRescued)act('🤝 斥候を連れて渡し場へ戻る（HP3 / 落雷で負傷）',()=>{s.scoutEscorting=true;s.turn++;hazard()},'warn');
if(s.scoutEscorting){$('story').textContent='🧭 負傷した斥候 HP '+s.scoutHp+'/3。落雷地点を一緒に踏むと斥候も負傷。渡し場まで連れ帰れば鉱石10と包帯を獲得。'+(s.scoutCover?' 遮雷布が次の直撃を1回防ぐ。':'');if(!s.scoutCoverUsed&&s.bag>=2)act('🛡️ 鉱石2で遮雷布を張る（斥候への落雷を1回防ぐ）',()=>{s.bag-=2;s.scoutCover=1;s.scoutCoverUsed=true;s.turn++;hazard();scoutTick()});if(p===7)act('🏕️ 斥候を無事に送り届ける',returnHome);}
if(s.scoutLost)$('story').textContent+=' 斥候は落雷で倒れ、救出は失敗した。';
if(p===0&&s.bridgeVaultOpen&&!s.bridgeVaultTaken)act('🗝️ 略奪者の鍵で石橋の地下宝物庫を開く（秘鉱+9）',()=>{s.bridgeVaultTaken=true;s.bag+=9;s.turn++;hazard()});
if(p===0&&!s.traceFound)act('石橋の傷跡を調べる（隠し鉱脈を発見）',()=>{s.traceFound=true;s.turn++;hazard()});
if(p===0&&s.traceFound&&!s.traceTaken)act('崩れた橋下で希少鉱石を採掘（HP-3 / 素材+7）',()=>{s.traceTaken=true;s.hp-=3;s.turn++;if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost';return}s.bag+=7;hazard()},'warn');
if(p===2&&s.ruinsLiberated&&!s.ruinsRested&&s.hp<10)act('💧 解放された泉で休む（HP+4 / 遠征1回）',()=>{s.hp=Math.min(s.altarSigil?12:10,s.hp+4);s.ruinsRested=true;s.turn++;hazard()});
if(p===2&&s.ruinsLiberated&&!s.ruinsOffering&&s.bag>=3)act('✨ 泉に鉱石3を捧げて雷雲を2行動鎮める',()=>{s.bag-=3;s.ruinsOffering=true;s.groundedUntil=Math.max(s.groundedUntil,s.turn+3);s.turn++;hazard()});
if(p===2&&s.bag>0&&s.cache===0)act('遺跡に鉱石を隠す（次の遠征で回収）',()=>{s.cache=s.bag;s.bag=0;s.cacheRun=s.run;s.turn++;hazard()});
if(p===2&&s.cache>0&&s.cacheRun<s.run)act('前回隠した鉱石を回収 +'+s.cache,()=>{s.bag+=s.cache;s.cache=0;s.turn++;hazard()});
if(p===5&&s.bag>=2&&s.turn>=s.divertUntil)act('誘導杭を設置（素材-2 / 雷雲を西へ3行動）',()=>{s.bag-=2;s.divertUntil=s.turn+4;s.turn++;hazard()});
if(p===3&&s.wolfHook&&!s.cliffTrailFound)act('🪝 鉤縄で崖の古い杭を調べる（石橋への隠し道を開通）',()=>{s.cliffTrailFound=true;if(!s.seen.includes(0))s.seen.push(0);s.turn++;hazard()});
if(p===0&&s.cliffTrailFound&&!s.cliffCacheTaken)act('💠 崖の隠し棚から希少鉱石を回収 +7',()=>{s.cliffCacheTaken=true;s.bag+=7;s.turn++;hazard()});
if(p===3&&!s.hunterDefeated&&!s.hunterAlert){
 if(!s.hunterScouted)act('🐾 岩棚の足跡を調べる（獣の縄張りを発見）',()=>{s.hunterScouted=true;s.turn++;hazard()});
 if(s.hunterScouted&&!s.hunterTrap&&s.bag>=2)act('🪤 鉱石2で狼罠を作る（次の戦闘で攻撃+1）',()=>{s.bag-=2;s.hunterTrap=true;s.turn++;hazard()});
 if(s.hunterScouted)act('🐺 灰狼の巣へ踏み込む（危険・戦利品+8）',()=>{s.hunterAlert=true;s.turn++;hazard()},'warn');
}
if(p===3&&!s.shelterBuilt&&s.bag>=4)act('岩棚に雨よけを築く（素材-4 / 次の遠征にも残る）',()=>{s.bag-=4;s.shelterBuilt=true;s.turn++;hazard()});
if(p===3&&s.shelterBuilt&&!s.shelterUsed&&s.hp<10)act('雨よけで手当て（HP+3 / 1遠征1回）',()=>{s.shelterUsed=true;s.hp=Math.min(s.altarSigil?12:10,s.hp+3);s.turn++;hazard()});
// Storm-chaser challenge: deliberately follow the moving lightning for three consecutive turns.
if(p===8&&!s.stormBeacon&&!s.stormReward&&!s.stormChaseFailed)act('⚡ 雷追いの試練を始める（落雷地点を合計3回踏む / 成功で秘鉱14）',()=>{s.stormBeacon=true;s.stormCharge=0;s.turn++;hazard()},'warn');
if(s.stormBeacon){
 const next=stormAt(s.turn+1),current=stormAt(s.turn);
 $('story').textContent='⚡ 雷追いの試練 '+s.stormCharge+'/3。雷雲の直撃地点を合計3回踏め。安全な道を経由しても記録は残る。次の落雷は '+(['北西','尖塔','遺跡','岩棚','祭壇','鉱脈','南西','渡し場','道標'][next]||'なし')+'。HPが尽きれば戦利品を失う。';
 if(current===p&&s.stormCharge===0)act('⚡ 雷を受けて試練を進める',()=>advance(),'warn');
 act('🏳️ 試練を諦める（戦利品は保持）',()=>{s.stormBeacon=false;s.stormChaseFailed=true});
}
if(s.stormReward&&p===8)act('⚡ 雷追いの記録を確認（秘鉱14獲得済み）',()=>{});
if(p===6&&!s.trailClue)act('🔎 岩陰の獣道を追う（道標の隠し荷を発見）',()=>{s.trailClue=true;s.turn++;hazard()});
if(p===8&&s.trailClue&&!s.trailCacheTaken)act('🎒 道標の隠し荷を掘る（鉱石+5 / 1行動）',()=>{s.trailCacheTaken=true;s.bag+=5;s.turn++;hazard()});
if(p===6&&s.bag>=1&&s.turn>=s.decoyUntil)act('⚡ 雷の囮石を置く（鉱石-1 / 道標へ2手誘導）',()=>{s.bag--;s.decoyUntil=s.turn+3;s.turn++;hazard()},'warn');
if(p===6||p===8)act('岩陰で雷雲を1手やり過ごす',waitTurn);
if(p===1&&s.turn>=s.groundedUntil&&s.bag>=2)act('素材2で避雷塔を接地（次の3行動は雷雲停止）',()=>{s.bag-=2;s.groundedUntil=s.turn+4});
// Movement uses the adjacent highlighted map tiles.
if(p===4&&s.turn<s.groundedUntil&&!s.coreTaken)act('雷核を掘り出す（HP-4 / 素材+8）',()=>{s.hp-=4;s.coreTaken=true;s.turn++;if(s.hp<=0){s.hp=0;s.bag=0;s.phase='lost';return}s.bag+=8;hazard()},'warn');
if(p===4&&s.turn<s.groundedUntil&&!s.chargedTaken)act('帯電結晶を回収 +5（接地中限定）',()=>{s.bag+=5;s.chargedTaken=true;s.turn++;hazard()});
const loot={0:2,2:3,3:2,4:6,5:4};
if(loot[p]&&!s.taken.includes(p)){const imminent=stormAt(s.turn+1)===p;act('鉱石を採集 +'+loot[p]+(imminent?'（落雷直前の鉱脈：追加+4）':''),()=>{s.bag+=loot[p]+(imminent?4:0);s.taken.push(p);s.turn++;hazard()},imminent?'warn':'')}
if(p===7&&s.circuitStage===3)act('⚡ 回路の最終印を刻む（秘鉱+11）',()=>{circuitTick()});
if(p===7)act('渡し場から生還する',()=>{if(s.altarLooted)s.altarSigil=true;returnHome()});
if(s.flareStock>0&&!s.flareUsed&&p!==7)act('緊急帰還信号を使う（持ち歩き素材の半分を確保）',()=>{s.flareStock--;s.flareUsed=true;s.bag=Math.floor(s.bag/2);returnHome()},'warn');
if(exits.includes(p))act('岸沿いに撤退（素材を捨てる）',()=>{s.bag=0;s.phase='camp'},'warn');
}
render();
</script></html>
