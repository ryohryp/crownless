<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crownless — 鏡の間・光路実験</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101c26;color:#f3edda}*{box-sizing:border-box}body{margin:0}main{max-width:520px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));gap:12px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:1.2rem;margin:0}p{margin:4px 0;line-height:1.4}#status{min-height:3em;font-size:.95rem}#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;width:100%;max-width:460px;margin:auto;aspect-ratio:1;background:#263541;border:4px solid #53626b;border-radius:8px;padding:3px}.tile{position:relative;border:1px solid #3b5361;border-radius:5px;background:#1a2b37;color:#f9e5a3;font-size:clamp(18px,7vw,32px);display:grid;place-items:center;min-width:0;min-height:0}.wall{background:#35434a;border-color:#56636a}.beam{background:#73643c;box-shadow:inset 0 0 0 2px #e7bc5d}.goal{color:#80e8b2}.mirror{cursor:pointer;touch-action:manipulation}.mirror:focus-visible{outline:3px solid white}#controls{margin-top:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button{min-height:48px;background:#324a56;border:1px solid #9daeb1;color:#fff2ce;border-radius:9px;font:inherit;font-weight:600;padding:8px}button:disabled{opacity:.4}.primary{background:#73603c}small{color:#becbd0}#bag{font-weight:700}
</style>
<main><header><h1>鏡の間：光路をつなげ</h1><span id="stage"></span></header><p id="status" role="status" aria-live="polite"></p><div id="board" aria-label="鏡をタップして光を反射させる5×5の部屋"></div><p id="bag"></p><small>黄色の光を緑の封印へ。鏡をタップして ／ と ＼ を切り替える。壁で光は止まる。途中で撤退すると今回の素材は失う。</small><div id="controls"><button id="retreat">撤退してやり直す</button><button id="claim" class="primary" disabled>封印を解除する</button><button id="next" disabled>次の部屋へ</button><button id="reset">最初から</button></div></main>
<script>
'use strict';
// Isolated, opt-in experiment: no GPS, no production save writes or inventory changes.
const levels=[
 {source:[0,2,'E'],goal:[4,0],walls:[[2,2],[3,2]],mirrors:[[4,2,'/']]},
 {source:[0,4,'E'],goal:[4,0],walls:[[2,2],[1,1]],mirrors:[[4,4,'/']]},
 {source:[0,4,'E'],goal:[4,0],walls:[[2,1],[3,3]],mirrors:[[2,4,'/'],[2,0,'/']]}
];
const dirs={E:[1,0],W:[-1,0],N:[0,-1],S:[0,1]};
const reflect=(dir,mirror)=>({ '/':{E:'N',N:'E',W:'S',S:'W'},'\\':{E:'S',S:'E',W:'N',N:'W'}}[mirror][dir]);
let level=0,orient=[],cleared=false,banked=0;
const el=id=>document.getElementById(id);
const key=(x,y)=>x+','+y;
function trace(){
 const spec=levels[level],mirrors=new Map(spec.mirrors.map(([x,y],i)=>[key(x,y),orient[i]])),walls=new Set(spec.walls.map(([x,y])=>key(x,y)));
 let [x,y,dir]=spec.source;const lit=new Set([key(x,y)]),seen=new Set();let success=false;
 for(let i=0;i<100;i++){
   const state=key(x,y)+','+dir;if(seen.has(state))break;seen.add(state);
   const [dx,dy]=dirs[dir];x+=dx;y+=dy;
   if(x<0||y<0||x>4||y>4||walls.has(key(x,y)))break;
   lit.add(key(x,y));
   if(x===spec.goal[0]&&y===spec.goal[1]){success=true;break;}
   if(mirrors.has(key(x,y)))dir=reflect(dir,mirrors.get(key(x,y)));
 }
 return {lit,success};
}
function render(){
 const spec=levels[level],result=trace(),walls=new Set(spec.walls.map(([x,y])=>key(x,y))),mirrorMap=new Map(spec.mirrors.map(([x,y],i)=>[key(x,y),i]));
 el('stage').textContent='部屋 '+(level+1)+' / '+levels.length;
 el('status').textContent=cleared?'封印を解除した！ 次の部屋へ進める。':result.success?'光が封印に届いた！ 解除して素材を回収しよう。':'鏡の向きを変えて光を封印まで導こう。';
 el('bag').textContent='今回の仮素材：'+banked+' 個（実ゲームの倉庫には未反映）';
 const board=el('board');board.replaceChildren();
 for(let y=0;y<5;y++)for(let x=0;x<5;x++){
  const k=key(x,y),idx=mirrorMap.get(k),isMirror=idx!==undefined;
  const node=document.createElement(isMirror?'button':'div');
  node.className='tile'+(walls.has(k)?' wall':'')+(result.lit.has(k)?' beam':'')+(isMirror?' mirror':'')+(x===spec.goal[0]&&y===spec.goal[1]?' goal':'');
  node.textContent=walls.has(k)?'▦':isMirror?orient[idx]:x===spec.source[0]&&y===spec.source[1]?'✦':x===spec.goal[0]&&y===spec.goal[1]?'◆':'';
  if(isMirror){node.setAttribute('aria-label','鏡 '+(idx+1)+'：'+(orient[idx]==='/'?'右上反射':'右下反射')+'。タップで回転');node.disabled=cleared;node.onclick=()=>{orient[idx]=orient[idx]==='/'?'\\':'/';render();};}
  board.append(node);
 }
 el('claim').disabled=cleared||!result.success;
 el('next').disabled=!cleared||level===levels.length-1;
}
function load(n){level=n;orient=levels[n].mirrors.map(x=>x[2]);cleared=false;render();}
el('claim').onclick=()=>{if(!cleared&&trace().success){cleared=true;banked++;render();}};
el('next').onclick=()=>{if(cleared&&level<levels.length-1)load(level+1);};
el('retreat').onclick=()=>{banked=0;load(level);};
el('reset').onclick=()=>{banked=0;load(0);};
load(0);
</script></html>
