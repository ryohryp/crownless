<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crownless | 危険な寄り道 実験</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b19;color:#f2eedb;font:16px system-ui}main{max-width:430px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px max(20px,env(safe-area-inset-bottom))}h1{font-size:23px;margin:4px 0 10px}.scene{flex:1;border:2px solid #697f65;background:linear-gradient(#263b35,#182923);border-radius:14px;padding:18px;min-height:260px}.icon{font-size:68px;text-align:center;margin:20px}#story{line-height:1.8;white-space:pre-line}#stats{padding:12px 0;font-weight:700}#actions{display:grid;gap:9px}button{min-height:52px;border:1px solid #b8bc86;border-radius:10px;background:#365847;color:white;font:700 16px system-ui;text-align:left;padding:10px 14px}button:disabled{opacity:.4}button.danger{background:#704535}small{color:#c5cbb4}
</style>
<main><h1>🌲 Crownless：獣道の奥</h1><div id="stats" aria-live="polite"></div><section class="scene"><div class="icon" id="icon">🌫️</div><div id="story" role="status"></div></section><div id="actions"></div><small>短い実験ステージ。戦利品は生還時だけ倉庫へ。既存本編のセーブには影響しません。</small></main>
<script>
'use strict';
const key='crownless-risk-cache-prototype-v1';
const fresh=()=>({hp:12,bank:0,bag:0,clue:false,phase:'start',visits:0,rope:false,shrineUsed:false,bridgeUsed:false,signal:false,signalUsed:false,caveUsed:false,caveKnown:false,caveEcho:false,caveBrace:false,sluiceOpen:false,sluiceUsed:false,crystalKnown:false,crystalUsed:false,beastMarked:false,lantern:false,deepCacheUsed:false});
let s;try{s=JSON.parse(localStorage.getItem(key))||fresh()}catch{s=fresh()}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{ /* session remains playable */ }}
function go(phase){s.phase=phase;save();render()}
function action(label,fn,kind=''){const b=document.createElement('button');b.textContent=label;b.className=kind;b.onclick=()=>{fn();save();render()};$('actions').append(b)}
function render(){
$('actions').replaceChildren();
$('stats').textContent='HP '+s.hp+'/12　持ち帰り前 '+s.bag+'　倉庫 '+s.bank+(s.rope?'　🪢登攀縄':'')+(s.lantern?'　🏮坑道灯':'');
const story=(icon,msg)=>{$('icon').textContent=icon;$('story').textContent=msg};
switch(s.phase){
case 'start':story('🌫️','獣道の奥から金属音。湿った足跡が二方向へ続く。\n安全に帰るか、危険を冒して確かめるか。');action('足跡を観察する（手掛かりを得る）',()=>{s.clue=true;go('fork')});action('音のする方へ直行する',()=>go('cache'),'danger');action('引き返して生還する',()=>go('camp'));break;
case 'fork':story('🐾','足跡は落ち葉の下で途切れる。石の裏に爪痕。\n爪痕は罠の位置を教えている。');action('爪痕を頼りに隠し場所へ',()=>go('cache'));if(!s.shrineUsed)action('苔むす祠を調べる（回復か採集を選ぶ）',()=>go('shrine'));if(!s.bridgeUsed)action('崩れた吊り橋を調べる（別の素材ルート）',()=>go('bridge'));if(s.signal&&!s.signalUsed)action('前回灯した狼煙の跡を追う（新しい隠し場所）',()=>go('signal'));if(s.caveKnown&&(!s.caveUsed||(s.sluiceOpen&&!s.sluiceUsed)||(!s.crystalUsed&&s.crystalKnown)))action('谷底の反響洞窟へ（音を頼りに探索）',()=>go('cave'));if(s.crystalKnown&&!s.crystalUsed)action('結晶の裂け目へ（新しい探索地点）',()=>go('crystal'));if(s.caveKnown&&s.lantern&&!s.deepCacheUsed)action('灯火で暗い横穴を探索する（新ルート）',()=>go('darkTunnel'));action('安全に帰る',()=>go('camp'));break;
case 'bridge':story('🌉',s.rope?'登攀縄で吊り橋を補強できる。橋の向こうに古い採集場がある。':'吊り橋の縄が切れかけている。渡れば傷を負うかもしれない。');action('橋を渡り採集する（素材+4、HP-'+(s.rope?1:5)+'）',()=>{s.hp-=s.rope?1:5;if(s.hp>0){s.bag+=4;s.bridgeUsed=true;s.signal=true;s.caveKnown=true;s.crystalKnown=true;go('bridgeReturn')}else go('lost')},'danger');action('橋を渡らず引き返す',()=>go('fork'));break;
case 'bridgeReturn':story('🌉','採集場の奥で橋が軋む。帰り道にも危険が残る。');action('採集品を抱えて戻る（HP-'+(s.rope?1:3)+'）',()=>{s.hp-=s.rope?1:3;go(s.hp>0?'fork':'lost')},'danger');action('採集品を置き、身軽に戻る（素材-4）',()=>{s.bag=Math.max(0,s.bag-4);go('fork')});break;
case 'signal':story('🪨','前回の遠征で崩れた橋の先に光が残っている。石の隙間には古い補給箱。慎重に開けるか、危険な奥まで探るか。');action('手前の補給箱を回収（素材+2）',()=>{s.bag+=2;s.signalUsed=true;go('fork')});action('崖の奥まで探索（素材+5、HP-4）',()=>{s.hp-=4;if(s.hp>0){s.bag+=5;s.signalUsed=true;go('fork')}else go('lost')},'danger');action('今は戻る',()=>go('fork'));break;
case 'cave':story('🕳️',s.caveEcho?'反響を聞き分けた。金属音の奥には落盤の前兆がある。支柱の位置も分かった。':'谷底の洞窟で水音が二方向から響く。冷たい風が吹く左の坑道と、金属音がする右の坑道。どちらを先に調べる？');if(!s.caveEcho)action('壁に石を打ち、反響を調べる（落盤の手掛かり）',()=>{s.caveEcho=true});if(s.caveEcho)action('水音の奥の水門を調べる（次回の近道を探す）',()=>go('sluice'));if(s.caveEcho&&!s.caveBrace&&s.bag>=2)action('支柱を補強する（持ち歩く素材-2、採掘と帰路が安全に）',()=>{s.bag-=2;s.caveBrace=true});if(s.crystalKnown&&!s.crystalUsed)action('結晶の裂け目へ向かう',()=>go('crystal'));if(!s.caveUsed)action('冷たい風を追う（安全な鉱石+2）',()=>{s.bag+=2;s.caveUsed=true;go('fork')});if(!s.caveUsed)action('金属音の奥へ進む（落盤の危険）',()=>go('caveDepth'),'danger');action('入口へ戻る',()=>go('fork'));break;
case 'darkTunnel':story('🏮','登攀縄の先に真っ暗な横穴。灯火があれば足場を見極められる。奥には古い鉱夫の工具箱がある。');action('足場を調べて工具箱を回収（素材+4、HP-2）',()=>{s.hp-=2;if(s.hp>0){s.bag+=4;s.deepCacheUsed=true;go('fork')}else go('lost')},'danger');action('危険を避けて入口に戻る',()=>go('fork'));break;
case 'crystal':story('💎','裂け目に青い結晶が光る。石を叩くと足場が震える。安全な破片だけ拾うか、足場を固定して深部の希少鉱石を狙うか。');action('縁の破片を拾う（素材+2）',()=>{s.bag+=2;s.crystalUsed=true;go('fork')});if(s.bag>=2)action('素材2個で足場を固定し深部を採掘（素材+7、HP-1）',()=>{s.bag-=2;s.hp-=1;if(s.hp>0){s.bag+=7;s.crystalUsed=true;go('fork')}else go('lost')},'danger');action('不安定な足場を飛び越える（素材+7、HP-7）',()=>{s.hp-=7;if(s.hp>0){s.bag+=7;s.crystalUsed=true;go('fork')}else go('lost')},'danger');action('今は引き返す',()=>go('fork'));break; 
case 'sluice':story('💧',s.sluiceOpen?'水門が開き、地下水路が見えている。前回開いた近道を使える。':'反響の奥に錆びた水門。持ち歩く素材2個で歯車を修理すれば、次の遠征から水路を使える。');if(!s.sluiceOpen&&s.bag>=2)action('素材2個で水門を修理する（恒久的に開通）',()=>{s.bag-=2;s.sluiceOpen=true});if(s.sluiceOpen&&!s.sluiceUsed)action('水路を探る（素材+3、HP-1）',()=>{s.hp-=1;if(s.hp>0){s.bag+=3;s.sluiceUsed=true;go('fork')}else go('lost')},'danger');action('洞窟へ戻る',()=>go('cave'));break;
case 'caveDepth':story('⛏️',s.caveBrace?'支柱が洞窟を支えている。鉱脈を採っても帰路が確保できそうだ。':'崩れかけた採掘跡。光る鉱脈が見えるが、足元の石が動き始めた。');action('支えを組み鉱脈を採る（素材+6、HP-'+(s.caveBrace?0:s.rope?2:s.caveEcho?3:6)+'）',()=>{s.hp-=s.caveBrace?0:s.rope?2:s.caveEcho?3:6;if(s.hp>0){s.bag+=6;s.caveUsed=true;go('fork')}else go('lost')},'danger');action('崩れる前に撤退する（素材なし）',()=>go('fork'));break;
case 'shrine':story('⛩️','祠の奥に澄んだ泉と古い供物台。泉で傷を癒やすか、供物台から素材を採るか。一度の遠征で選べるのは片方だけ。');action('泉で回復する（HP+4、最大12）',()=>{s.hp=Math.min(12,s.hp+4);s.shrineUsed=true;go('fork')});action('供物台から採集する（素材+2）',()=>{s.bag+=2;s.shrineUsed=true;go('fork')},'danger');break;
case 'cache':story('🗝️',s.clue?'罠の留め金が見えた。慎重に開ければ傷は浅い。':'古い箱に獣の牙。罠の仕組みは見えない。');action('慎重に開ける（素材+1、HP-'+(s.clue?1:4)+'）',()=>{s.hp-=s.clue?1:4;s.bag+=1;go(s.hp>0?'escape':'lost')});action('強引に奪う（素材+3、HP-7）',()=>{s.hp-=7;s.bag+=3;go(s.hp>0?'escape':'lost')},'danger');action('触らずに撤退',()=>go('camp'));break;
case 'escape':story('🐺','獣の唸り声が迫る。戦利品を抱えて走るか、荷物を捨てて安全を取るか。');action('崖下の光を追う（希少素材+2、HP-'+(s.rope?1:3)+'）',()=>{s.hp-=s.rope?1:3;if(s.hp>0){s.bag+=2;go('ridge')}else go('lost')},'danger');action('獣の予兆を読み、迎え撃つ',()=>go('ambush'));action('戦利品を守って走る（HP-2）',()=>{s.hp-=2;go(s.hp>0?'camp':'lost')},'danger');action('戦利品を捨てて逃げる',()=>{s.bag=0;go('camp')});break;
case 'ambush':story('🐺',s.beastMarked?'獣の突進経路を見切った。岩棚の死角を利用できる。':'茂みが揺れ、獣が飛び出す直前だ。足跡から動きを予測できるか？');if(s.clue&&!s.beastMarked)action('足跡から突進経路を読む（次の行動の負傷を軽減）',()=>{s.beastMarked=true});action('身を伏せてやり過ごす（'+(s.clue?'HP-1':'HP-4')+'）',()=>{s.hp-=s.clue?1:4;go(s.hp>0?'camp':'lost')});action('囮を投げて獣の巣を探る（素材+2、HP-4）',()=>{s.hp-=s.beastMarked?2:4;if(s.hp>0){s.bag+=2;go('camp')}else go('lost')},'danger');action('岩棚へ誘い込み、背後の鉱脈を採る（素材+3、HP-'+(s.rope?1:5)+'）',()=>{s.hp-=s.rope?1:s.beastMarked?2:5;if(s.hp>0){s.bag+=3;go('camp')}else go('lost')},'danger');action('荷物を捨てて逃げる',()=>{s.bag=0;go('camp')});break;
case 'ridge':story('✨','崖下に星鉄の欠片を見つけた。だが帰路は険しい。荷物を抱えて逃げ切るか？');action('崖を登って帰る（HP-'+(s.rope?1:3)+'）',()=>{s.hp-=s.rope?1:3;go(s.hp>0?'camp':'lost')},'danger');action('希少素材を捨てて安全な道へ（素材-2）',()=>{s.bag=Math.max(0,s.bag-2);go('camp')});break;
case 'lost':s.bag=0;story('💀','力尽きた。未帰還の素材は失われた。倉庫の素材は無事だ。');action('キャンプから再挑戦',()=>{s.hp=12;s.clue=false;s.beastMarked=false;s.shrineUsed=false;s.bridgeUsed=false;s.signalUsed=false;s.caveUsed=false;s.caveEcho=false;s.caveBrace=false;s.sluiceUsed=false;s.crystalUsed=false;s.deepCacheUsed=false;go('start')});break;
case 'camp':if(s.bag>0){s.bank+=s.bag;s.bag=0;s.visits++}story('🔥','無事にキャンプへ戻った。戦利品は倉庫へ確定した。\n素材3個で登攀縄を製作すると、次回から崖の往復が安全になる。');if(!s.rope&&s.bank>=3)action('素材3個で登攀縄を作る（次の遠征も有効）',()=>{s.bank-=3;s.rope=true});if(!s.lantern&&s.bank>=4)action('素材4個で坑道灯を製作（暗い横穴を開放）',()=>{s.bank-=4;s.lantern=true});action('もう一度遠征する',()=>{s.hp=12;s.clue=false;s.beastMarked=false;s.shrineUsed=false;s.bridgeUsed=false;s.signalUsed=false;s.sluiceUsed=false;s.caveUsed=false;s.caveEcho=false;s.caveBrace=false;s.crystalUsed=false;go('start')});action('実験データをリセット',()=>{s=fresh();go('start')});break;
default:s=fresh();go('start');return;
}
save();
}
render();
</script></html>
