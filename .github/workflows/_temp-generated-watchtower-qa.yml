name: Temporary generated background image QA
on:
  push:
    branches: [test/watchtower-image-vision-e2e]
permissions:
  contents: read
jobs:
  candidate-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install official Jev SDK, sharp and Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Evaluate generated candidate without approving it
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          node - <<'NODE'
          const {run}=require('./scripts/asset-quality-gate.cjs');
          (async()=>{
            const report=await run('docs/visual/quality-gate-generated-watchtower.json',{stage:'all',force:true});
            const summary={
              image:report.candidate,
              geometry:report.geometry,
              assetStatus:report.asset?.status,
              assetIssues:report.asset?.issues??[],
              assetError:report.asset?.error??null,
              phoneStatus:report.phone?.status,
              phoneChecks:report.phone?.checks??null,
              phoneError:report.phone?.error??null,
              visionRequests:report.api.requests,
              humanApproval:'required; not adopted'
            };
            console.log('CANDIDATE_QA_SUMMARY '+JSON.stringify(summary));
            if(report.geometry?.problems?.length||report.phone?.checks?.issues?.length||report.asset?.error==='image_preparation_failed'||report.phone?.error==='phone_capture_failed')process.exitCode=1;
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Candidate binary integrity
        run: |
          echo "Source preview SHA-256:"
          sha256sum .qa/candidates/generated-watchtower-inkwash-512.jpg
      - name: Archive candidate report and phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-watchtower-candidate-review
          path: .qa/asset-quality/
          retention-days: 2
          if-no-files-found: warn
