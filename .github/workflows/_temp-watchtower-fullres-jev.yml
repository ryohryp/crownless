name: Temporary full-resolution watchtower Jev Vision QA
on:
  push:
    branches:
      - review/watchtower-fullres-live-20261016

permissions:
  contents: read

jobs:
  evaluate-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify user-uploaded original before installing dependencies
        run: |
          echo '56fb9dbd3c5cc71c97465c9a03dac3b6227a8b0e018fb8a4786f205f3fe155d0  .qa/candidates/a_wide_atmospheric_landscape_illustration_paintin.png' | sha256sum --check --status
          echo "Original candidate checksum verified"
      - name: Install QA tools without secrets
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real Jev Vision and 3-width phone evaluation
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ASSET_QA_MANIFEST: docs/visual/quality-gate-watchtower-fullres.json
        run: node scripts/run-image-review-ci.cjs
      - name: Archive two-day private review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-watchtower-original-jev
          path: .qa/asset-quality/
          retention-days: 2
          if-no-files-found: ignore
