name: Materialize player anchor

on:
  push:
    paths:
      - '.anchor-upload/player-unarmed-v0.2/**'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check upload chunks
        id: chunks
        shell: bash
        run: |
          count=$(find .anchor-upload/player-unarmed-v0.2 -maxdepth 1 -type f -name 'part-*' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 10 ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Materialize exact anchor
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p docs/assets
          cat .anchor-upload/player-unarmed-v0.2/part-* | base64 -d > docs/assets/player-unarmed-approved-anchor-v0.2.jpg
          echo '1e183fc295eef742c740cef64b17e70d822c5537955db794942bc33120059958  docs/assets/player-unarmed-approved-anchor-v0.2.jpg' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/player-unarmed-approved-anchor-v0.2.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize approved protagonist anchor'
            git push
          fi
