name: Cleanup merged stronghold branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-stronghold-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged stronghold branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feat/social-stronghold-mvp"
            "feat/social-stronghold-mvp-v2"
          )
          for branch in "${branches[@]}"; do
            ref="heads/$branch"
            if gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/$ref" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$ref"
              echo "DELETE $branch"
            fi
          done
