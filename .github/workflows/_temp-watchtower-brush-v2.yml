name: Temporary Watchtower Brush Candidate Review
on:
  push:
    branches:
      - review/watchtower-inkwash-brush-v2-20261016
permissions:
  contents: read
jobs:
  review-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify image checksum before installing dependencies
        run: |
          echo 'fae5d33ea7d20720b778dcdfee590c6722c7adc35dfc87f636da4578d0743999  .qa/candidates/watchtower-inkwash-brush-v2-640.jpg' | sha256sum --check --status
          echo 'Candidate image verified'
      - name: Install QA tools before providing secrets
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Evaluate unapproved art using real Jev Vision and phone
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ASSET_QA_MANIFEST: docs/visual/quality-gate-watchtower-brush-v2.json
        run: node scripts/run-image-review-ci.cjs
      - name: Archive short-lived QA report and actual phone images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-watchtower-brush-v2-review
          path: .qa/asset-quality/
          retention-days: 2
          if-no-files-found: ignore
