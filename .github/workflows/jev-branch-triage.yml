name: Jev branch triage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jev-branch-triage.yml

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Evaluate remaining branches with Jev
        shell: bash
        run: |
          node <<'NODE'
          const endpoint = "https://api.typesafe.ai/v1/systemone";
          const branches = [{"branch":"chatgpt/reboot-territory-road-control","ahead":1,"behind":212,"files":["src/reboot-wego-controller.js","src/reboot-wego-encounter.js","test/reboot-wego-encounter.test.js"]},{"branch":"ci/deeper-loot-cue-v4-full","ahead":5,"behind":164,"files":[".github/workflows/validate-deeper-loot-cue-full.yml","src/slice-app.js","test/slice-app.test.js"]},{"branch":"ci/deeper-loot-cue-v4-run","ahead":5,"behind":164,"files":[".github/workflows/validate-deeper-loot-cue.yml","src/slice-app.js","test/slice-app.test.js"]},{"branch":"ci/deeper-loot-cue-v4","ahead":4,"behind":164,"files":["src/slice-app.js","test/slice-app.test.js"]},{"branch":"ci/return-risk-loot-summary","ahead":2,"behind":163,"files":["src/slice-app.js","test/return-risk-loot-summary.test.js"]},{"branch":"codex/autopilot-status-classification","ahead":7,"behind":387,"files":["docs/adr/0003-autopilot-conditional-auto-merge.md","scripts/autopilot/planner-invocation.js","scripts/autopilot/select-issue.js","scripts/autopilot/work-items.js","test/autopilot-lifecycle-classification.test.js"]},{"branch":"codex/issue-123-hearth-visual-fix","ahead":2,"behind":624,"files":[]},{"branch":"codex/playable-expedition-slice","ahead":2,"behind":170,"files":[".github/workflows/pages.yml","README.md","expedition.html","index.html","package.json","src/slice-app.js","src/slice-art.js","src/slice-engine.js"]},{"branch":"feat/deeper-loot-cue-v2","ahead":1,"behind":164,"files":["src/slice-app.js"]},{"branch":"feat/deeper-loot-cue-v3","ahead":3,"behind":164,"files":["src/slice-app.js","test/slice-app.test.js"]},{"branch":"feat/exploration-mystery-chain","ahead":1,"behind":31,"files":["src/slice-engine.js"]},{"branch":"feat/loot-choice-ready","ahead":2,"behind":163,"files":["src/slice-app.js","test/return-risk-loot-summary.test.js"]},{"branch":"feat/loot-risk-choice","ahead":2,"behind":163,"files":["src/slice-app.js","test/return-risk-loot-summary.test.js"]},{"branch":"feat/loot-variant-visuals","ahead":1,"behind":37,"files":["src/slice-app.js","src/slice-art.js"]},{"branch":"feat/replayability-enemies-events","ahead":7,"behind":917,"files":["README.md","src/app.js","src/game-core.js","test/game-core.test.js"]},{"branch":"feat/return-risk-loot-summary-pr","ahead":2,"behind":163,"files":["src/slice-app.js","test/return-risk-loot-summary.test.js"]},{"branch":"feat/return-risk-loot-summary-v2","ahead":2,"behind":163,"files":["src/slice-app.js","test/return-risk-loot-summary.test.js"]},{"branch":"feat/484-place-memory","ahead":2,"behind":162,"files":["src/slice-app.js","test/slice-app.test.js"]},{"branch":"feat/512-territory-world-trace","ahead":8,"behind":341,"files":[".github/workflows/test.yml","scripts/check-territory-reward-surface.cjs","src/expedition-unknown-bridge.js","src/territory-world-trace.js","test/territory-world-trace.test.js"]},{"branch":"feat/512-territory-world-trace-final","ahead":1,"behind":341,"files":["src/territory-world-trace.js","src/expedition-unknown-bridge.js","test/territory-world-trace.test.js"]},{"branch":"feat/512-territory-world-trace-pr","ahead":1,"behind":341,"files":["src/territory-world-trace.js","src/expedition-unknown-bridge.js","test/territory-world-trace.test.js"]},{"branch":"feat/580-fog-discovery-map","ahead":1,"behind":163,"files":["slice.css","src/slice-app.js","test/slice-app.test.js"]},{"branch":"feat/602-kamishibai-viewport","ahead":1,"behind":143,"files":["expedition-kamishibai.css"]},{"branch":"fix/combat-feedback-visibility-ready","ahead":1,"behind":41,"files":["combat-feedback.css","test/combat-feedback-visibility.test.js"]},{"branch":"fix/noncombat-presentation","ahead":5,"behind":909,"files":[".github/workflows/test.yml","index.html","src/noncombat-presentation.js"]},{"branch":"fix/582-loot-comparison-current-gear","ahead":1,"behind":41,"files":["src/loot-comparison-ui.js","test/issue-582-loot-comparison-ui.test.js"]},{"branch":"fix/582-loot-hunt-comparison","ahead":2,"behind":41,"files":["src/slice-app.js","test/issue-582-loot-comparison.test.js"]},{"branch":"fix/843-expedition-recap-report-dom","ahead":0,"behind":0,"files":[]},{"branch":"fix-797-starter-reinforce-gear-ui","ahead":1,"behind":42,"files":["bottom-navigation.css","phone-density.css","scripts/serve-slice.cjs","src/slice-engine.js","test/serve-slice.test.js","test/slice-engine.test.js"]},{"branch":"issue-535-reboot-phase4","ahead":7,"behind":331,"files":["reboot-phase3.css","reboot-phase4.css","reboot.html","src/reboot-phase4-controller.js","src/reboot-phase4-state.js","test/reboot-prototype-phase4.test.js"]},{"branch":"merge/deeper-loot-cue-v4","ahead":5,"behind":164,"files":["src/slice-app.js","test/slice-app.test.js"]}];

          if (!process.env.TYPESAFE_API_KEY) {
            console.error("TYPESAFE_API_KEY missing");
            process.exit(2);
          }

          const questions = {
            verdict: {
              type: "choice",
              instructions: "Decide what to do with this stale Crownless Git branch. Evaluate branch value, staleness, overlap with current main, and whether its implementation targets the current playable slice.",
              criteria: {
                delete_branch: "The branch itself is obsolete, duplicated, already represented by current main, or targets retired architecture. Delete it.",
                migrate_concept: "The branch implementation is stale or tied to old architecture, but the product concept is still useful. Delete the branch and reimplement the concept later on current main.",
                keep_for_integration: "The branch contains a current, directly useful implementation worth inspecting/rebasing/porting now before deletion."
              }
            },
            value_score: {
              type: "score",
              instructions: "How valuable is the branch's unique change to the current Crownless goal: play ~15 minutes and want one more expedition?",
              criteria: [
                "No current value or fully obsolete.",
                "Minor historical value only.",
                "Useful concept but stale implementation.",
                "Strong current gameplay/UI value.",
                "Critical current improvement worth integrating now."
              ]
            },
            staleness_risk: {
              type: "noul",
              instructions: "Is there a high risk that directly integrating this branch would reintroduce obsolete architecture, duplicate existing work, or create regressions?",
              criteria: {
                true: "High staleness/duplication/regression risk.",
                false: "Low risk; branch remains close to current implementation."
              }
            }
          };

          for (const b of branches) {
            const state = {
              game: "Crownless",
              current_canon: "main + AGENTS.md. Current playable path is expedition.html using src/slice-app.js and src/slice-engine.js. Historical Reboot/game-core/autopilot paths are not Canon.",
              product_goal: "Explore -> Fight -> Loot -> Return alive -> Improve -> Explore farther. Make a 15-minute session create desire for one more expedition.",
              branch: b.branch,
              commits_ahead_of_main: b.ahead,
              commits_behind_main: b.behind,
              changed_files: b.files
            };
            const res = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${process.env.TYPESAFE_API_KEY}`
              },
              body: JSON.stringify({ model: "jev-latest", state, questions })
            });
            if (!res.ok) {
              console.log("JEV_BRANCH_ERROR " + JSON.stringify({branch:b.branch,status:res.status,text:(await res.text()).slice(0,300)}));
              continue;
            }
            const data = await res.json();
            console.log("JEV_BRANCH_RESULT " + JSON.stringify({branch:b.branch,answers:data.answers}));
          }
          NODE
