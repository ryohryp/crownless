name: Temporary Crownless Canon Rebuild

on:
  push:
    branches:
      - fix/current-visual-director-canon

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Crownless current branch
        uses: actions/checkout@v4
      - name: Checkout approved Visual Director compiler
        uses: actions/checkout@v4
        with:
          repository: ryohryp/visual-director
          ref: ee69b0a6c1c26d4c4fb0cab559b3663dbc890371
          path: .qa/visual-director
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compile with the actual canonical provider
        run: |
          npm ci --prefix .qa/visual-director --no-audit --no-fund
          npm run build --prefix .qa/visual-director
          node .qa/visual-director/dist/index.js compile --project-id crownless --repo-path .
          node -e 'const fs=require("node:fs"); console.log("CANON_BEGIN"); for(const line of fs.readFileSync(".visual-director/compiled-canon.json","utf8").trimEnd().split("\n")) console.log("CANON_LINE:"+line); console.log("CANON_END");'
