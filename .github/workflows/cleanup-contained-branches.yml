name: Cleanup contained branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-contained-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches fully contained by surviving descendants
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in             "feat/deeper-loot-cue-v2"             "feat/deeper-loot-cue-v3"             "ci/deeper-loot-cue-v4"
          do
            ref="heads/$branch"
            echo "DELETE $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$ref"
          done
