name: agent-format-470
on:
  push:
    branches:
      - fix/atlas-expedition-entrypoint-470
permissions:
  contents: write
jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/expedition-presentation.js')
          s = p.read_text()
          old = '''  window.CrownlessExpeditionPresentation = Object.freeze({
          open,
          close,
          isReady() { return true; }
        });'''
          new = '''  window.CrownlessExpeditionPresentation = Object.freeze({
            open,
            close,
            isReady() { return true; }
          });'''
          if old not in s:
              raise SystemExit('presentation formatting block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/world-atlas-actions-presentation.js')
          s = p.read_text()
          start = s.index('  function openExpedition(document, root, entry, status) {')
          end = s.index('\n\n  function ensureStylesheet(document)', start)
          block = s[start:end]
          lines = block.splitlines()
          formatted = [lines[0]]
          for line in lines[1:-1]:
              formatted.append('  ' + line)
          formatted.append(lines[-1])
          p.write_text(s[:start] + '\n'.join(formatted) + s[end:])
          PY
      - name: Focused tests
        run: node --test test/expedition-entrypoint.test.js test/world-atlas-actions-presentation.test.js test/app-runtime-state.test.js
      - name: Full validation
        run: npm test
      - name: Commit validated formatting
        run: |
          rm .github/workflows/agent-format-470.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Atlas expedition entrypoint fix"
          git push origin HEAD
