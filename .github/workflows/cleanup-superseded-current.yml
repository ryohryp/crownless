name: Cleanup superseded current branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-superseded-current.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feat/825-stagger-climax"
            "feat/841-save-backup"
            "fix/843-expedition-recap-report"
            "codex/playable-expedition-slice"
          )
          for branch in "${branches[@]}"; do
            ref="heads/$branch"
            echo "DELETE $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$ref"
          done
