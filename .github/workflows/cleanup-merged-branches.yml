name: Cleanup merged branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-branches.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete branches already merged into main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"
          default_branch="${{ github.event.repository.default_branch }}"

          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

          deleted=0
          kept=0
          checked=0

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin/ |
              sort -u
          )

          for branch in "${branches[@]}"; do
            [[ -z "$branch" ]] && continue
            [[ "$branch" == "HEAD" ]] && continue
            [[ "$branch" == "$default_branch" ]] && continue

            checked=$((checked + 1))
            tip="$(git rev-parse "refs/remotes/origin/$branch")"
            reason=""

            # Safe for normal merge/rebase: branch tip is already an ancestor of main.
            if git merge-base --is-ancestor "$tip" "origin/$default_branch"; then
              reason="tip is contained in $default_branch"
            else
              # Safe for squash merges: delete only when a merged PR exists whose
              # recorded head SHA exactly matches the branch's current tip.
              if gh api --method GET "repos/$repo/pulls"                 -f state=closed                 -f "head=$owner:$branch"                 -F per_page=100                 --jq '.[] | select(.merged_at != null) | .head.sha' |
                grep -Fxq "$tip"; then
                reason="merged PR head matches current tip"
              fi
            fi

            if [[ -n "$reason" ]]; then
              echo "DELETE $branch ($reason)"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "KEEP   $branch (unmerged or changed after merge)"
              kept=$((kept + 1))
            fi
          done

          echo "Checked: $checked"
          echo "Deleted: $deleted"
          echo "Kept: $kept"
