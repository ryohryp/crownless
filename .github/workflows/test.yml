name: test

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check src/game-core.js
          node --check src/hunt-system.js
          node --check src/dungeon-system.js
          node --check src/progression-system.js
          node --check src/save-system.js
          node --check src/app-runtime-state.js
          node --check src/combat-action-profiles.js
          node --check src/app.js
          node --check src/noncombat-presentation.js
          node --check src/exploration-map-presentation.js
          node --check src/hearth-presentation.js
          node --check src/hearth-home-shell.js
          node --check src/desktop-input.js
          node --check src/world-atlas.js
          node --check src/world-atlas-actions-presentation.js
          node --check src/territory-phase1.js
          node --check src/territory-reward-surface.js
          node --check src/territory-world-trace.js
          node --check src/territory-mobile-declutter.js
          node --check src/expedition-presentation.js
          node --check scripts/check-atlas-viewport.cjs
          node --check scripts/check-territory-phase1.cjs
          node --check scripts/check-territory-reward-surface.cjs
          node --check scripts/check-territory-mobile-declutter.cjs
          node --check scripts/check-hearth-home-shell.cjs
      - name: Unit tests
        run: npm test

  atlas-viewport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser QA tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Hearth shell initializes and stays bounded
        run: node scripts/check-hearth-home-shell.cjs load
      - name: Hearth loot shelf folio
        run: node scripts/check-hearth-home-shell.cjs loot
      - name: Hearth expedition record folio
        run: node scripts/check-hearth-home-shell.cjs record
      - name: Atlas mobile and desktop loop
        run: node scripts/check-atlas-viewport.cjs
      - name: Territory Phase 1 mobile golden slice
        run: node scripts/check-territory-phase1.cjs
      - name: Territory reward surface, build choice, and World Trace
        run: node scripts/check-territory-reward-surface.cjs
      - name: Territory mobile declutter
        run: node scripts/check-territory-mobile-declutter.cjs
      - name: Reboot chapter, all branches and GPS recovery
        run: node scripts/check-reboot-chapter.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reboot-chapter-screenshots
          path: /tmp/reboot-qa/*.png
          retention-days: 3
          if-no-files-found: ignore
