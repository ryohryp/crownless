name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check src/game-core.js
          node --check src/hunt-system.js
          node --check src/dungeon-system.js
          node --check src/progression-system.js
          node --check src/save-system.js
          node --check src/noncombat-presentation.js
          node --check src/exploration-map-presentation.js
          node --check src/hearth-presentation.js
          node --check src/hearth-home-shell.js
          node --check src/world-atlas.js
          node --check src/world-atlas-actions-presentation.js
          node --check src/territory-phase1.js
          node --check src/territory-reward-surface.js
          node --check src/territory-world-trace.js
          node --check src/territory-mobile-declutter.js
          node --check src/expedition-presentation.js
      - name: Install official image-evaluation SDK for transport smoke
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Unit tests
        run: npm test

  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned test-only Chromium tool
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Phone map, landmark and save smoke
        run: npm run playtest:smoke
      - name: Gemini-source combat baseline phone smoke
        run: node scripts/verify-gemini-feel-phone.cjs
      - name: Pixel forest real-input exploration and forge loop
        run: npm run playtest:pixel-forest
      - name: Approved protagonist walking and comparison phone smoke
        run: node scripts/verify-hero-still.cjs
      - name: Visual candidate temporary placement smoke
        run: node --test test/asset-quality-phone.test.js
      - name: Upload failed or manually requested QA screenshots
        # Successful PR checks keep their results in logs; manual runs provide full visual evidence.
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: crownless-phone-smoke
          path: .qa/browser/
          if-no-files-found: ignore
          retention-days: 1
