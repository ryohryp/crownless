name: test

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check src/game-core.js
          node --check src/hunt-system.js
          node --check src/dungeon-system.js
          node --check src/progression-system.js
          node --check src/save-system.js
          node --check src/app-runtime-state.js
          node --check src/combat-action-profiles.js
          node --check src/app.js
          node --check src/noncombat-presentation.js
          node --check src/exploration-map-presentation.js
          node --check src/hearth-presentation.js
          node --check src/desktop-input.js
          node --check src/world-atlas.js
          node --check src/world-atlas-actions-presentation.js
          node --check src/expedition-presentation.js
          node --check scripts/check-atlas-viewport.cjs
      - name: Unit tests
        run: npm test

  atlas-viewport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser QA tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Atlas mobile and desktop loop
        run: node scripts/check-atlas-viewport.cjs
