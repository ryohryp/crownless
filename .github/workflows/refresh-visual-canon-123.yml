name: Refresh Visual Canon for Issue 123

on:
  pull_request:
    branches:
      - main
    paths:
      - .visual-director/manifest.json
      - .visual-director/grand-design.json
      - .visual-director/compiled-canon.json
      - .github/workflows/refresh-visual-canon-123.yml

permissions:
  contents: write

jobs:
  compile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crownless PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild compiled Canon deterministically
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';

          const compiledPath = '.visual-director/compiled-canon.json';
          const grandDesignPath = '.visual-director/grand-design.json';
          const current = JSON.parse(await readFile(compiledPath, 'utf8'));
          const grandDesign = JSON.parse(await readFile(grandDesignPath, 'utf8'));

          function sortJson(value) {
            if (Array.isArray(value)) return value.map(sortJson);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(
              Object.entries(value)
                .sort(([left], [right]) => left.localeCompare(right))
                .map(([key, nested]) => [key, sortJson(nested)]),
            );
          }
          function stableJson(value) {
            return JSON.stringify(sortJson(value), null, 2);
          }

          const subjectlessRules = Object.fromEntries(
            Object.keys(grandDesign.asset_types ?? {})
              .filter((assetType) => assetType !== 'character_visual_anchor')
              .map((assetType) => [assetType, {
                must_use_approved_anchor: false,
                must_not_chain_from_candidate: true,
                must_review_after_generation: true,
              }]),
          );
          const semanticPayload = {
            project_id: current.project_id,
            grand_design: grandDesign,
            global_style_lock: current.global_style_lock,
            world_direction: current.world_direction,
            avoid_block: current.avoid_block,
            asset_type_rules: {
              ...subjectlessRules,
              character_visual_anchor: { ...current.policy },
            },
            subjects: current.subjects,
            global_reference_path: current.global_reference_path,
            policy: { ...current.policy },
          };
          const sourceRevision = createHash('sha256')
            .update(stableJson(semanticPayload))
            .digest('hex');
          const compiled = {
            schema_version: 1,
            source_revision: sourceRevision,
            ...semanticPayload,
          };
          await writeFile(compiledPath, `${stableJson(compiled)}\n`, 'utf8');
          NODE

      - name: Verify Issue 123 subjectless policy
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const compiled = JSON.parse(await readFile('.visual-director/compiled-canon.json', 'utf8'));
          const background = compiled.asset_type_rules?.background;
          if (!compiled.grand_design?.asset_types?.background) throw new Error('grand_design background contract missing');
          if (compiled.grand_design.asset_types.background.source_reference_required !== false) throw new Error('source_reference_required must be false');
          if (!background || background.must_use_approved_anchor !== false || background.must_not_chain_from_candidate !== true || background.must_review_after_generation !== true) {
            throw new Error('compiled background policy is invalid');
          }
          if (!/^[a-f0-9]{64}$/.test(compiled.source_revision ?? '')) throw new Error('source_revision is invalid');
          NODE

      - name: Commit regenerated Canon
        run: |
          if git diff --quiet -- .visual-director/compiled-canon.json; then
            echo "Compiled Canon already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .visual-director/compiled-canon.json
          git commit -m "chore: refresh compiled visual canon"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
