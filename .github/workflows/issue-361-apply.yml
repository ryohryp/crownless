name: issue-361-apply

on:
  push:
    branches: ["feat/361-nearby-density"]
    paths:
      - ".github/workflows/issue-361-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/361-nearby-density
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: node scripts/apply-issue-361.js
      - name: Validate focused scope
        run: |
          node --check src/world-atlas.js
          node --check src/location-discovery-runtime.js
          node --test test/world-atlas-nearby.test.js test/world-atlas-nearby-density.test.js test/location-discovery-runtime.test.js
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 周辺調査の表示密度を上げる (#361)"
          git push origin HEAD:feat/361-nearby-density
