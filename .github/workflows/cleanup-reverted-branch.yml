name: Cleanup reverted branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-reverted-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete fully reverted branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/codex/issue-123-hearth-visual-fix"
