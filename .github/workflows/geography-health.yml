name: geography-production-health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: geography-production-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GEOGRAPHY_URL: https://crownless-iota.vercel.app/api/geography?lat=35.69&lng=139.78&radius=650

    steps:
      - name: Check Production geography enrichment API
        shell: bash
        run: |
          success="false"
          last_status="unknown"

          for attempt in 1 2; do
            response="/tmp/geography-response-attempt-${attempt}.json"
            status="000"

            if status="$(curl --show-error --silent --output "$response" --write-out '%{http_code}' --max-time 18 "$GEOGRAPHY_URL")"; then
              curl_exit=0
            else
              curl_exit=$?
            fi

            last_status="$status"
            echo "Production geography health attempt ${attempt}/2: HTTP ${status}, curl exit ${curl_exit}"
            if [ -f "$response" ]; then
              cat "$response"
              echo
            fi

            if [ "$curl_exit" -eq 0 ] && [ "$status" = "200" ]; then
              mv "$response" /tmp/geography-response.json
              echo "GEOGRAPHY_HEALTH_ATTEMPTS=$attempt" >> "$GITHUB_ENV"
              success="true"
              break
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "Transient Production geography transport failure; retrying once in 2 seconds." >&2
              sleep 2
            fi
          done

          if [ "$success" != "true" ]; then
            export GEOGRAPHY_FAILURE_RESPONSE="/tmp/geography-response-attempt-2.json"
            export GEOGRAPHY_FAILURE_STATUS="$last_status"
            node <<'NODE'
            const fs = require("node:fs");
            const responsePath = process.env.GEOGRAPHY_FAILURE_RESPONSE;
            const lines = [
              "## Geography Production failure", "",
              `- Final HTTP status: ${process.env.GEOGRAPHY_FAILURE_STATUS || "unknown"}`,
              "- Health-check attempts: 2/2",
              "- Gameplay impact: simulated discovery remains available"
            ];

            if (!responsePath || !fs.existsSync(responsePath)) {
              lines.push("- Structured upstream diagnostics: unavailable (no response body)");
            } else {
              try {
                const payload = JSON.parse(fs.readFileSync(responsePath, "utf8"));
                if (payload.error) lines.push(`- API error: ${payload.error}`);
                if (payload.timeoutMs) lines.push(`- Timeout per upstream: ${payload.timeoutMs} ms`);
                if (Array.isArray(payload.attempts) && payload.attempts.length) {
                  lines.push(`- Recorded attempts: ${payload.attempts.length}/${payload.total || payload.attempts.length}`);
                  for (const attempt of payload.attempts) {
                    const status = attempt && attempt.httpStatus == null ? "-" : attempt.httpStatus;
                    const duration = attempt && attempt.durationMs == null ? "-" : `${attempt.durationMs}ms`;
                    const kind = attempt && attempt.failureKind ? attempt.failureKind : "-";
                    const state = attempt && attempt.state ? attempt.state : "unknown";
                    const endpoint = attempt && attempt.endpoint ? attempt.endpoint : "unknown";
                    lines.push(`- ${state}: \`${endpoint}\` — HTTP ${status}, ${duration}, ${kind}`);
                  }
                } else {
                  lines.push("- Structured upstream diagnostics: unavailable (attempt history missing)");
                }
              } catch (error) {
                lines.push(`- Structured upstream diagnostics: unavailable (${error.message})`);
              }
            }

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
            NODE
            echo "Expected HTTP 200 from Production geography API within two 18-second attempts, last status $last_status" >&2
            exit 1
          fi

      - name: Validate structured upstream history or simulated fallback
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/geography-response.json", "utf8"));
          if (!Array.isArray(payload.attempts) || payload.attempts.length === 0) throw new Error("Missing geography attempt history");
          if (!Array.isArray(payload.elements)) throw new Error("Missing geography elements array");

          const degraded = payload.degraded === true;
          const successful = payload.attempts.filter((attempt) => attempt && attempt.state === "success");
          const failed = payload.attempts.filter((attempt) => attempt && attempt.state === "failed");

          if (degraded) {
            if (payload.fallback !== "simulated") throw new Error("Degraded geography response must select simulated fallback");
            if (successful.length) throw new Error("Degraded geography response unexpectedly contains a successful upstream");
            if (payload.endpoint != null) throw new Error("Degraded geography response must not claim a selected upstream endpoint");
          } else {
            if (!payload.endpoint || typeof payload.endpoint !== "string") throw new Error("Missing successful geography endpoint");
            if (!successful.length) throw new Error("No successful upstream attempt recorded");
          }

          const lines = [
            "## Geography Production health", "",
            `- Health-check attempts: ${process.env.GEOGRAPHY_HEALTH_ATTEMPTS || "1"}/2`,
            `- Mode: ${degraded ? "simulated fallback" : "live geography"}`,
            `- Selected endpoint: ${degraded ? "none" : `\`${payload.endpoint}\``}`,
            `- Recorded attempts: ${payload.attempts.length}/${payload.total || payload.attempts.length}`,
            `- Timeout per upstream: ${payload.timeoutMs || "unknown"} ms`,
            `- Degraded mirrors recorded: ${failed.length}`,
            `- Gameplay impact: ${degraded ? "live enrichment unavailable; simulated discovery remains playable" : "non-blocking enrichment"}`
          ];
          for (const attempt of payload.attempts) {
            const status = attempt.httpStatus == null ? "-" : attempt.httpStatus;
            const duration = attempt.durationMs == null ? "-" : `${attempt.durationMs}ms`;
            const kind = attempt.failureKind || "-";
            lines.push(`- ${attempt.state}: \`${attempt.endpoint}\` — HTTP ${status}, ${duration}, ${kind}`);
          }
          if (degraded) lines.push("", "> All configured Overpass upstreams failed; Crownless deliberately fell back to simulated discovery.");
          else if (failed.length) lines.push("", "> Production is available, but one or more Overpass upstreams are degraded.");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE
