name: apply battlefield weapon fix

on:
  push:
    branches: ["agent/fix-battlefield-weapon-pickup"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-battlefield-weapon-pickup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch battlefield weapon behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/app.js")
          text = path.read_text()

          pickup = '''  function updateBattlefieldPickup() {
            const p = battle.player;
            if (p.attack && p.attack.kind !== "light") return false;
            const target = battle.droppedWeapons
              .filter((drop) => !drop.picked && dist(drop, p) <= 64)
              .sort((a, b) => dist(a, p) - dist(b, p))[0] || null;
            if (!target) return false;
            equipBattlefieldWeapon(target);
            return true;
          }
          '''
          text, count = re.subn(
              r'  function updateBattlefieldPickup\(dt\) \{.*?^  \}\n(?=\n  function beginVictoryPickupWindow)',
              pickup.rstrip("\n"),
              text,
              count=1,
              flags=re.S | re.M,
          )
          assert count == 1, "pickup function not found"

          start = text.index("  function updatePlayerIntent(dt) {")
          end = text.index("\n  function updateAutoStrike()", start)
          block = text[start:end]
          block = block.replace('      battle.droppedWeapons.forEach((drop) => { if (!drop.picked) drop.pickup = 0; });\n', '')
          block = block.replace('      if (!updateBattlefieldPickup(dt)) updateAutoStrike();\n', '')
          marker = '    p.y = clamp(p.y, 92, canvas.height - 58);\n'
          assert block.count(marker) == 1, "player clamp marker not found"
          block = block.replace(marker, marker + '    const pickedWeapon = updateBattlefieldPickup();\n    if (!p.moving && !pickedWeapon) updateAutoStrike();\n')
          text = text[:start] + block + text[end:]

          camera_pattern = re.compile(
              r'    const target = nearestEnemy\(\);\n'
              r'    const zoom = mobileView\(\) \? 1\.38 : 1\.08;\n'
              r'    const focusX = target \? battle\.player\.x \* 0\.52 \+ target\.x \* 0\.48 : battle\.player\.x;\n'
              r'    const focusY = target \? battle\.player\.y \* 0\.55 \+ target\.y \* 0\.45 : battle\.player\.y;'
          )
          text, count = camera_pattern.subn(
              '    const zoom = mobileView() ? 1.14 : 1.08;\n'
              '    const focusX = canvas.width / 2;\n'
              '    const focusY = canvas.height / 2;',
              text,
              count=1,
          )
          assert count == 1, "camera block not found"

          assert text.count('    const near = dist(drop, p) <= 62;') == 1
          text = text.replace('    const near = dist(drop, p) <= 62;', '    const near = dist(drop, p) <= 76;')

          prompt_pattern = re.compile(
              r'    if \(near\) \{\n'
              r'      const progress = clamp\(drop\.pickup / 0\.18, 0, 1\);\n'
              r'      ctx\.strokeStyle = "#f1d77e";\n'
              r'      ctx\.lineWidth = 4;\n'
              r'      ctx\.beginPath\(\); ctx\.arc\(drop\.x, drop\.y, 30, -Math\.PI / 2, -Math\.PI / 2 \+ Math\.PI \* 2 \* progress\); ctx\.stroke\(\);\n'
              r'      ctx\.fillStyle = "rgba\(246,232,194,\.95\)";\n'
              r'      ctx\.font = "800 11px ui-sans-serif, system-ui";\n'
              r'      ctx\.textAlign = "center";\n'
              r'      ctx\.fillText\("止まって拾う", drop\.x, drop\.y - 36\);\n'
              r'    \}'
          )
          text, count = prompt_pattern.subn(
              '    if (near) {\n'
              '      ctx.strokeStyle = "#f1d77e";\n'
              '      ctx.lineWidth = 3;\n'
              '      ctx.beginPath(); ctx.arc(drop.x, drop.y, 30, 0, Math.PI * 2); ctx.stroke();\n'
              '      ctx.fillStyle = "rgba(246,232,194,.95)";\n'
              '      ctx.font = "800 11px ui-sans-serif, system-ui";\n'
              '      ctx.textAlign = "center";\n'
              '      ctx.fillText("触れれば拾う", drop.x, drop.y - 36);\n'
              '    }',
              text,
              count=1,
          )
          assert count == 1, "drop prompt not found"

          old = '    battle.victoryPickupTimer = unpicked.length ? 1.6 : 0.35;\n    if (unpicked.length) flashMessage("敵の武器が落ちた。近くで止まれば拾える。", 1150);'
          new = '    battle.victoryPickupTimer = unpicked.length ? 0.7 : 0.35;\n    if (unpicked.length) flashMessage("敵の武器が落ちた。触れれば拾える。", 800);'
          assert text.count(old) == 1, "victory pickup message not found"
          text = text.replace(old, new)

          old_help = '<span><kbd>WASD</kbd> / ドラッグ 移動</span><span>停止 <b>AUTO STRIKE</b></span><span>武器の上で停止 <b>PICK UP</b></span><span><kbd>K</kbd> 技</span><span><kbd>SPACE</kbd> 回避</span><span class="hint">敵の狙いを外す → 止まって反撃。倒した敵の武器も使える。</span>'
          new_help = '<span><kbd>WASD</kbd> / ドラッグ 移動</span><span>停止 <b>AUTO STRIKE</b></span><span>武器に触れる <b>PICK UP</b></span><span><kbd>K</kbd> 技</span><span><kbd>SPACE</kbd> 回避</span><span class="hint">敵の狙いを外す → 止まって反撃。倒した敵の武器は触れるだけで拾える。</span>'
          assert text.count(old_help) == 1, "combat help not found"
          text = text.replace(old_help, new_help)

          path.write_text(text)
          PY
      - name: Validate
        run: |
          node --check src/app.js
          npm test
      - name: Commit patched app
        run: |
          if git diff --quiet -- src/app.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "fix battlefield weapon pickup"
          git push origin HEAD:agent/fix-battlefield-weapon-pickup
