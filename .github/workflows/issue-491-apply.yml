name: Apply Issue 491 Atlas tempo fix

on:
  push:
    branches:
      - fix/491-instant-atlas-return

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/491-instant-atlas-return
          fetch-depth: 0

      - name: Apply bounded Atlas patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/world-atlas.js")
          text = path.read_text()
          replacements = [
              (
                  '    if (!result) return "地図を開くと現在地の周囲を調べ、新しい遠征候補を探索録へ残す。";',
                  '    if (!result) return "記憶済みの地図を表示している。新しい周辺情報が必要なら「周辺を再調査」できる。";'
              ),
              (
                  '    scanText.textContent = scanResultText(options.scanResult, Boolean(options.scanning));',
                  '    scanText.textContent = scanResultText(options.scanResult || lastScanResult, Boolean(options.scanning));'
              ),
              (
                  '    rescan.addEventListener("click", () => runScan(true));\n    if (options.autoScan !== false && !options.scanning) runScan(false);',
                  '    rescan.addEventListener("click", () => runScan(true));\n    const shouldPrimeEmptyAtlas = !lastScanResult && nearbyModel.length === 0 && worldModel.discoveryCount === 0;\n    if (!options.scanning && (options.autoScan === true || (options.autoScan !== false && shouldPrimeEmptyAtlas))) runScan(false);'
              ),
              (
                  '    wallMap.setAttribute("aria-label", "現在地周辺を調べ、これまで歩いて書いた世界地図を開く");',
                  '    wallMap.setAttribute("aria-label", "これまで歩いて書いた世界地図を開く");'
              ),
              (
                  '    entry.textContent = "世界地図を開く・周辺を調べる →";',
                  '    entry.textContent = "世界地図を開く →";'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:80]}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Focused validation
        run: |
          node --check src/world-atlas.js
          node --test test/world-atlas-nearby-density.test.js
          git diff --check

      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/issue-491-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world-atlas.js test/world-atlas-nearby-density.test.js .github/workflows/issue-491-apply.yml
          git commit -m "fix: return to Atlas without repeated GPS wait (#491)"
          git push origin HEAD:fix/491-instant-atlas-return
