name: refactor-183-integrate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'fix/186-complete-combat-action-profile-extraction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused refactor
        run: node scripts/apply-refactor-183.cjs
      - name: Validate syntax
        run: |
          node --check src/combat-action-profiles.js
          node --check src/app.js
      - name: Run tests
        run: npm test
      - name: Upload integrated files
        uses: actions/upload-artifact@v4
        with:
          name: combat-action-profile-integration
          path: |
            src/app.js
            index.html
            test/combat-action-profiles.test.js
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js index.html test/combat-action-profiles.test.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: wire combat action profiles into app"
          git push origin HEAD:${{ github.head_ref }}
