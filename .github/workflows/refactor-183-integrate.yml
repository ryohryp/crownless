name: refactor-183-integrate

on:
  push:
    branches: [refactor/183-extract-combat-action-profiles]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/183-extract-combat-action-profiles
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused refactor
        run: node scripts/apply-refactor-183.cjs
      - name: Validate syntax
        run: |
          node --check src/combat-action-profiles.js
          node --check src/app.js
      - name: Run tests
        run: npm test
      - name: Remove one-shot tooling
        run: |
          rm scripts/apply-refactor-183.cjs
          rm .github/workflows/refactor-183-integrate.yml
      - name: Commit integrated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: wire combat action profiles into app (#183)"
          git push origin HEAD:refactor/183-extract-combat-action-profiles
