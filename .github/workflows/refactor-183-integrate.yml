name: refactor-183-integrate

on:
  push:
    branches: [fix/183-finalize-combat-action-profiles]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/183-finalize-combat-action-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused refactor
        run: node scripts/apply-refactor-183.cjs
      - name: Validate syntax
        run: |
          node --check src/combat-action-profiles.js
          node --check src/app.js
      - name: Run tests
        run: npm test
      - name: Commit integrated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "refactor: integrate combat action profiles"
          git push origin HEAD:fix/183-finalize-combat-action-profiles
