name: issue-193-test-diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests and capture output
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          echo "$status" > test-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: issue-193-test-output
          path: |
            test-output.txt
            test-status.txt
