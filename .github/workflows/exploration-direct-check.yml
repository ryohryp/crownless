name: Exploration direct check

on:
  pull_request:
    paths:
      - 'src/exploration-map-presentation.js'
      - 'src/discovery-provider.js'
      - 'test/discovered-destinations.test.js'
      - 'test/exploration-presentation-contract.test.js'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
