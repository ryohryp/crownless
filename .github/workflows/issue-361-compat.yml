name: issue-361-compat

on:
  push:
    branches: ["feat/361-nearby-density"]
    paths:
      - ".github/workflows/issue-361-compat.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/361-nearby-density
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compatibility-preserving density patch
        run: node scripts/apply-issue-361-compat.js
      - name: Validate focused scope
        run: |
          node --check src/world-atlas.js
          node --check src/location-discovery-runtime.js
          node --check src/geography-api-provider.js
          node --test test/world-atlas-nearby.test.js test/world-atlas-nearby-density.test.js test/location-discovery-runtime.test.js
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 既存の周辺探索契約を保ったまま6件表示する (#361)"
          git push origin HEAD:feat/361-nearby-density
