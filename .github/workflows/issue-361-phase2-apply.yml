name: Apply Issue 361 Phase 2 action density

on:
  push:
    branches:
      - feat/361-atlas-next-actions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/361-atlas-next-actions
          fetch-depth: 0

      - name: Apply Phase 2 slice
        run: python scripts/apply-issue-361-phase2.py

      - name: Validate focused Phase 2 slice
        run: |
          node --check src/world-atlas-npc-signals.js
          node --test test/world-atlas-npc-signals.test.js
          git diff --check

      - name: Commit bounded implementation
        run: |
          rm scripts/apply-issue-361-phase2.py
          rm .github/workflows/issue-361-phase2-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world-atlas-npc-signals.js world-atlas.css test/world-atlas-npc-signals.test.js scripts/check-atlas-viewport.cjs scripts/apply-issue-361-phase2.py .github/workflows/issue-361-phase2-apply.yml
          git commit -m "feat: surface two next actions in nearby Atlas (#361)"
          git push origin HEAD:feat/361-atlas-next-actions
