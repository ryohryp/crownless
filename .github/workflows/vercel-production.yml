name: deploy-vercel-production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "index.html"
      - "*.css"
      - "src/geography-proxy.js"
      - "src/discovery-provider.js"
      - "src/location-discovery-runtime.js"
      - "src/location-visuals.js"
      - "src/exploration-map-presentation.js"
      - "src/hearth-presentation.js"
      - "assets/locations/**"
      - "vercel.json"
      - ".github/workflows/vercel-production.yml"

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_DVFM365SzDMxINnnp2gvKmVK
      VERCEL_PROJECT_ID: prj_eEu4lM3lJYasKa9YSHhLWs5J9eFS
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_URL: https://crownless-iota.vercel.app

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required secret
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN GitHub secret is not configured." >&2
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Pull Vercel production settings
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production output
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy exact prebuilt output to Production
        id: deploy
        shell: bash
        run: |
          deployment_url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Deployment URL: $deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test Production homepage
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 4 --retry-delay 3 "$PRODUCTION_URL/" > /dev/null

      - name: Smoke test geography validation route
        shell: bash
        run: |
          status="$(curl --show-error --silent --output /tmp/geography-validation.json --write-out '%{http_code}' --max-time 8 "$PRODUCTION_URL/api/geography?lat=999&lng=139&radius=650")"
          cat /tmp/geography-validation.json
          if [ "$status" != "400" ]; then
            echo "Expected geography validation endpoint to return HTTP 400, got $status" >&2
            exit 1
          fi

      - name: Smoke test real Production geography route
        shell: bash
        run: |
          status="$(curl --show-error --silent --output /tmp/geography-response.json --write-out '%{http_code}' --max-time 18 "$PRODUCTION_URL/api/geography?lat=35.69&lng=139.78&radius=650")"
          cat /tmp/geography-response.json
          echo
          if [ "$status" != "200" ] && [ "$status" != "502" ]; then
            echo "Expected geography enrichment endpoint to complete within 18 seconds with HTTP 200 or diagnostic 502, got $status" >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const { DEFAULT_TIMEOUT_MS } = require("./src/geography-proxy.js");
          const payload = JSON.parse(fs.readFileSync("/tmp/geography-response.json", "utf8"));
          if (!Array.isArray(payload.attempts) || payload.attempts.length === 0) {
            throw new Error("Production geography response is missing upstream attempts diagnostics");
          }
          if (!Number.isFinite(Number(payload.timeoutMs)) || Number(payload.timeoutMs) > DEFAULT_TIMEOUT_MS) {
            throw new Error(`Unexpected Production upstream timeout: ${payload.timeoutMs} (configured ${DEFAULT_TIMEOUT_MS})`);
          }
          NODE

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Vercel Production deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Production: $PRODUCTION_URL"
            echo "- Geography enrichment API smoke budget: <= 18s"
            echo "- Gameplay geography wait: non-blocking"
            echo "- Smoke tests: passed"
          } >> "$GITHUB_STEP_SUMMARY"
