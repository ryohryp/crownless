name: stand-strike-migration

on:
  push:
    branches:
      - agent/main-stand-to-strike
    paths:
      - scripts/apply-main-stand-strike.mjs
      - .github/workflows/stand-strike-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/main-stand-to-strike
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply combat migration
        run: node scripts/apply-main-stand-strike.mjs
      - name: Repair generated contract assertion
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'test/main-stand-strike.test.js';
          let test = fs.readFileSync(path, 'utf8');
          test = test.replace(
            '  assert.match(app, /d > profile\\.range + target\\.radius/);',
            '  assert.ok(app.includes("if (d > profile.range + target.radius) return;"));'
          );
          fs.writeFileSync(path, test);
          NODE
      - name: Validate migration
        run: |
          node --check src/app.js
          node --test test/main-stand-strike.test.js
      - name: Commit migrated combat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js test/main-stand-strike.test.js
          git commit -m "Implement stand-to-strike main combat"
          git push origin HEAD:agent/main-stand-to-strike
