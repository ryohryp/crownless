name: deploy-pages

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run also fires for PR checks; never deploy those or failed runs.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish the exact source tested on main, not the workflow's own default-branch SHA.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check whether GitHub Pages is enabled
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl --silent --show-error \
            --output /tmp/pages.json \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pages")

          if [ "${status}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=GitHub Pages is not enabled::Open Settings → Pages and set Build and deployment / Source to GitHub Actions once. Future main pushes will publish automatically."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - name: Stage Pages artifact with commit-fingerprinted assets
        if: steps.pages.outputs.enabled == 'true'
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git' \
            --exclude '_site' \
            --exclude '.github' \
            --exclude '.visual-director' \
            --exclude '.vscode' \
            --exclude 'art-source' \
            --exclude 'docs' \
            --exclude 'scripts' \
            --exclude 'skills' \
            --exclude 'test' \
            --exclude 'tests' \
            --exclude 'test-support' \
            --exclude 'tools' \
            ./ _site/
          DEPLOY_SHA="$DEPLOY_SHA" node <<'NODE'
          const fs = require('node:fs');
          const sha = String(process.env.DEPLOY_SHA || '').trim();
          if (!sha) throw new Error('DEPLOY_SHA is required for Pages asset fingerprinting');
          const version = sha.slice(0, 12);
          for (const path of ['_site/index.html', '_site/expedition.html', '_site/reboot.html']) {
            if (!fs.existsSync(path)) continue;
            const html = fs.readFileSync(path, 'utf8').replace(
              /((?:href|src)=["'])(?!https?:|\/\/|#|data:)([^"'?]+\.(?:css|js))(?:\?[^"']*)?(["'])/g,
              `$1$2?v=${version}$3`
            );
            fs.writeFileSync(path, html);
          }
          NODE
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
