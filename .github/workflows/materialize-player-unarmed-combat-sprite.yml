name: materialize protagonist combat sprite

on:
  push:
    paths:
      - '.sprite-upload/player-unarmed-combat-v0.1/**'
      - '.github/workflows/materialize-player-unarmed-combat-sprite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize sprite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/combat/minimal-v0.1/actors
          cat .sprite-upload/player-unarmed-combat-v0.1/part-* > assets/combat/minimal-v0.1/actors/player-unarmed-combat-sprite-sheet-v0.1.png
          echo '254278979afc1bc2eb6d776d55fada47c8643450aedc06100e5dd0e21855a19d  assets/combat/minimal-v0.1/actors/player-unarmed-combat-sprite-sheet-v0.1.png' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/combat/minimal-v0.1/actors/player-unarmed-combat-sprite-sheet-v0.1.png
          git rm -r .sprite-upload/player-unarmed-combat-v0.1
          git commit -m 'Add protagonist combat sprite sheet'
          git push
