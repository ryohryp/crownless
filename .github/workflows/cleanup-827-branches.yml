name: Cleanup merged 827 branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-827-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged 827 branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "fix/827-maintenance-camp-routing"
            "test/827-hearth-maintenance-main"
            "fix/827-hearth-maintenance-complete"
          )
          for branch in "${branches[@]}"; do
            ref="heads/$branch"
            if gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/$ref" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$ref"
              echo "DELETE $branch"
            fi
          done
