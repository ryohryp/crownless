name: battlefield-weapon-pickup-migration

on:
  push:
    branches:
      - agent/battlefield-weapon-pickup
    paths:
      - scripts/apply-battlefield-weapon-pickup.mjs
      - .github/workflows/battlefield-weapon-pickup-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/battlefield-weapon-pickup
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply pickup migration
        run: node scripts/apply-battlefield-weapon-pickup.mjs
      - name: Validate pickup migration
        run: |
          node --check src/app.js
          node --test test/battlefield-weapon-pickup.test.js
      - name: Commit pickup implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js test/battlefield-weapon-pickup.test.js
          git commit -m "Add battlefield weapon pickups"
          git push origin HEAD:agent/battlefield-weapon-pickup
