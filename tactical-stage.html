<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171d1c">
  <title>Crownless — 霧の古城（クォータービュー試遊ステージ）</title>
  <link rel="stylesheet" href="tactical-stage.css">
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <div class="game-brand">
        <strong>CROWNLESS</strong>
        <span>霧の古城 · グラフィック試作</span>
      </div>
      <div class="game-status" aria-label="遠征状況">
        <span id="hpReadout">体力 100/100</span>
        <span id="lootReadout">持帰り候補 0</span>
      </div>
    </header>

    <main class="stage-viewport" aria-label="霧の古城の探索マップ">
      <canvas id="stageCanvas" tabindex="0" aria-label="斜め見下ろしの幻想世界。次の道へ進むにはマップをタップするか、下のボタンを押してください。"></canvas>
      <div class="stage-location" id="locationLabel">北の丘陵 · 未踏の道</div>
      <div class="stage-discovery" id="discoveryBanner" hidden aria-live="polite">
        <span>NEW LOCATION</span><strong>霧の古城を発見した</strong>
      </div>
      <div class="stage-loading" id="stageLoading">幻想世界を読み込んでいます…</div>
      <div class="stage-hint" id="stageHint">マップをタップして進める</div>
    </main>

    <footer class="command-deck">
      <div class="story-readout">
        <span id="phaseLabel">探索</span>
        <p id="message" aria-live="polite">森の入口。遠くに崩れた石壁が見える。</p>
      </div>
      <div class="commands" id="commands" aria-label="探索アクション"></div>
      <div class="stage-meta">
        <span>この試作は実GPS・本編セーブに接続しません</span>
        <a href="expedition.html">本編に戻る</a>
      </div>
    </footer>
  </div>
  <script src="src/tactical-stage-core.js"></script>
  <script src="src/tactical-stage.js"></script>
</body>
</html>
