<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crownless — 赤いスカーフの主人公レビュー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202920;color:#ece5d2;font:16px/1.65 system-ui,sans-serif}main{max-width:980px;margin:auto;padding:24px 16px}h1{font-size:25px}h2{font-size:18px;color:#d6c7a2}p{max-width:70ch}a{color:#e2c994}section{padding:18px 0;border-top:1px solid #657057}.panel{border:1px solid #56644e;border-radius:8px;padding:12px;background:#313c30}.atlas{image-rendering:pixelated;width:100%;max-width:768px;display:block;margin:auto}.screens{display:flex;gap:16px;flex-wrap:wrap}.screens>div{flex:1 1 260px}canvas{display:block;max-width:100%;background:#394335;image-rendering:pixelated}.links{display:flex;gap:20px;flex-wrap:wrap}button{min-height:44px;padding:8px 16px}
</style>
<main><p>CROWNLESS / ART REVIEW</p>
<h1>新主人公・赤いスカーフ</h1>
<p>2026年11月14日に採用されたデザインを基準に、ゲーム用の透過4コマを作成しました。歩行は時間でコマ送りし、停止時は同じキャラクターの静止ポーズに戻ります。</p>
<section><h2>ゲーム用4コマ（右向き）</h2><div class="panel"><img class="atlas" src="assets/action-forest/hero-red-scarf-atlas.png" alt="黒髪と赤いスカーフの主人公。交互に足を出す4つの歩行コマ"></div><small>実データ: 384×132px／1コマ96×132px／背景透過</small></section>
<section class="screens"><div><h2>歩行</h2><canvas id="walkPreview" width="360" height="250" aria-label="主人公の歩行プレビュー"></canvas><p><button id="toggleWalk" type="button">歩行を止める</button></p></div><div><h2>立ち止まった姿</h2><canvas id="stillPreview" width="360" height="250" aria-label="主人公の静止プレビュー"></canvas></div></section>
<section><h2>ゲームで確認する</h2><div class="links"><a href="gemini-feel-lab.html?actor=walk">探索画面で歩く</a><a href="gemini-feel-lab.html?actor=still">静止画モード</a><a href="gemini-feel-lab.html?actor=classic">旧コード描画と比較</a></div><p>新しい静止画デザインは採用済み。4コマの動き・視認性は実機プレイで検証する候補です。攻撃・被弾などの専用ポーズはまだありません。</p></section>
</main>
<script src="src/hero-still-review.js"></script>
<script>
const actor=CrownlessHeroStill.create(),walkCtx=document.querySelector('#walkPreview').getContext('2d'),stillCtx=document.querySelector('#stillPreview').getContext('2d');let moving=true;
document.querySelector('#toggleWalk').onclick=()=>{moving=!moving;document.querySelector('#toggleWalk').textContent=moving?'歩行を止める':'歩行を再生する';};
function preview(t){for(const [ctx,state] of [[walkCtx,moving?'WALK':'IDLE'],[stillCtx,'IDLE']]){ctx.clearRect(0,0,360,250);ctx.save();ctx.translate(180,230);ctx.scale(3,3);actor.draw(ctx,{state,animTime:t/100});ctx.restore();}requestAnimationFrame(preview);}requestAnimationFrame(preview);
</script></html>
